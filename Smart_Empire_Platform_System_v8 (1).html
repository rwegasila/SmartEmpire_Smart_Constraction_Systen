<title>Smart Empire Platform System | Global Construction Management Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<style>
/* ================================================================
   SMART EMPIRE PLATFORM SYSTEM — Design System v5
   Palette: Imperial Navy + Emerald Empire + Royal Gold accent
   ================================================================ */
:root{
  --a:#ffb000;--a2:#cc8d00;--a-soft:#fff3d9;
  --b:#002756;--b2:#013a7a;
  --bg:#f3f6fb;--card:#ffffff;--card2:#f8fafc;
  --muted:#64748b;--line:#e5eaf2;
  --danger:#dc2626;--danger-soft:#fee2e2;
  --gold:#ffb000;--gold-bright:#ffc93d;
  --radius:16px;--radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.06);
  --shadow-md:0 8px 24px -8px rgba(15,23,42,.14),0 2px 8px -2px rgba(15,23,42,.08);
  --shadow-lg:0 24px 60px -20px rgba(11,16,32,.35);
  --font-head:'Sora',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  --font-body:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --a:#ffb000;--a2:#e6a000;--a-soft:#2a1f04;
  --b:#00173a;--b2:#012c63;
  --bg:#04102a;--b3:#002756;--card:#0a1f42;--card2:#081a37;
  --muted:#8fa0bd;--line:#173357;
  --danger:#f87171;--danger-soft:#3a1414;
  --gold:#ffb000;--gold-bright:#ffc93d;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 10px 28px -10px rgba(0,0,0,.55);
  --shadow-lg:0 30px 70px -20px rgba(0,0,0,.7);
  color-scheme:dark;
}
:root[data-theme="dark"] body{color:#e9f0fb}
:root[data-theme="dark"] input,:root[data-theme="dark"] select,:root[data-theme="dark"] textarea{background:#0b1322;color:#e9f0fb;border-color:var(--line)}
:root[data-theme="dark"] .msg{background:#141f36}:root[data-theme="dark"] .msg.mine{background:#0d2f28}
:root[data-theme="dark"] .fin-card,:root[data-theme="dark"] table{background:transparent}
:root[data-theme="dark"] aside{background:var(--card)}
:root[dir="rtl"] body{direction:rtl}
:root[dir="rtl"] .nav{text-align:right}
:root[dir="rtl"] .step{grid-template-columns:75px 1fr 145px}

*{box-sizing:border-box}
::selection{background:var(--a);color:#fff}
body{margin:0;font:15px/1.55 var(--font-body);background:var(--bg);background:
  radial-gradient(1100px 480px at 100% -10%, color-mix(in srgb, var(--a) 10%, transparent), transparent 60%),
  radial-gradient(900px 420px at -10% 0%, color-mix(in srgb, var(--gold) 8%, transparent), transparent 55%),
  var(--bg);color:#172033;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-head);letter-spacing:-.01em}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:color-mix(in srgb, var(--muted) 45%, transparent);border-radius:99px}::-webkit-scrollbar-track{background:transparent}

/* ---------- Header ---------- */
header{background:linear-gradient(115deg,var(--b) 0%,var(--b2) 55%,var(--a2) 130%);color:#fff;padding:calc(13px + env(safe-area-inset-top,0px)) 22px 13px;display:flex;justify-content:space-between;align-items:center;gap:14px;position:sticky;top:0;z-index:50;box-shadow:0 6px 24px -10px rgba(0,0,0,.45);flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.06)}
header>div:first-child{display:flex;align-items:center;gap:11px}
.brand{font-family:var(--font-head);font-weight:800;font-size:20px;letter-spacing:.01em;display:flex;align-items:center;gap:9px}
.brand-emblem{width:36px;height:36px;flex:0 0 auto;border-radius:10px;background:transparent;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.brand-emblem img{width:100%;height:100%}
.small{font-size:12px}
#brandTag{opacity:.82}
#who{display:flex;align-items:center;gap:9px}
#who button.alt{padding:7px 12px;font-size:12.5px}

/* ---------- Layout / Sidebar ---------- */
.layout{display:grid;grid-template-columns:252px 1fr;min-height:calc(100vh - 64px)}
aside{background:var(--card);border-right:1px solid var(--line);padding:16px 12px}
.nav{width:100%;padding:11px 13px;text-align:left;border:0;background:transparent;color:#172033;border-radius:11px;margin:2px 0;cursor:pointer;font-weight:600;font-size:13.6px;display:flex;align-items:center;gap:10px;transition:background .15s ease,color .15s ease,transform .1s ease;position:relative}
:root[data-theme="dark"] .nav{color:#dbe6f6}
.nav:hover{background:var(--a-soft);color:var(--a2)}
.nav:active{transform:scale(.98)}
.nav.active{background:linear-gradient(90deg,var(--a-soft),transparent);color:var(--a2);font-weight:800}
.nav.active::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 6px 6px 0;background:linear-gradient(180deg,var(--a),var(--gold))}
:root[data-theme="dark"] .nav.active{color:var(--a)}

main{padding:26px 28px 60px;max-width:1400px;width:100%;min-width:0;margin:auto;animation:fadeUp .28s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:var(--shadow-sm);margin-bottom:14px;transition:box-shadow .18s ease,transform .18s ease}
.card:hover{box-shadow:var(--shadow-md)}

.metric{font-family:var(--font-head);font-size:31px;font-weight:800;color:var(--a2);background:linear-gradient(90deg,var(--a2),var(--a));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
:root[data-theme="dark"] .metric{-webkit-text-fill-color:initial;color:var(--a)}
.muted{color:var(--muted)}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);margin:5px 0 10px;background:var(--card);color:inherit;transition:border-color .15s ease,box-shadow .15s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 4px color-mix(in srgb, var(--a) 16%, transparent)}
textarea{min-height:90px;resize:vertical}
button{padding:11px 16px;border:0;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--a),var(--a2));color:white;cursor:pointer;font-weight:700;letter-spacing:.01em;box-shadow:0 3px 10px -3px color-mix(in srgb, var(--a) 60%, transparent);transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}
button:hover{filter:brightness(1.06);box-shadow:0 6px 16px -4px color-mix(in srgb, var(--a) 65%, transparent)}
button:active{transform:translateY(1px) scale(.98)}
button.alt{background:linear-gradient(135deg,#475569,#334155);box-shadow:0 3px 10px -3px rgba(51,65,85,.5)}
button.gold{background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#3a2a05;box-shadow:0 3px 10px -3px rgba(201,147,47,.55)}
button.danger{background:linear-gradient(135deg,#ef4444,var(--danger));box-shadow:0 3px 10px -3px rgba(220,38,38,.5)}

.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}.row>button{flex:0 0 auto}
table{width:100%;border-collapse:collapse}td,th{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
tr:hover td{background:color-mix(in srgb, var(--a) 4%, transparent)}
.badge{padding:4px 10px;border-radius:99px;background:var(--a-soft);color:var(--a2);font-size:11.5px;font-weight:800;letter-spacing:.02em}

/* ---------- Login / Auth ---------- */
.login{
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:32px 16px;box-sizing:border-box;margin:0;
  background:radial-gradient(120% 140% at 15% 0%,#013a7a 0%,#00224f 45%,#001126 100%);
}
.login .card{width:100%;max-width:440px;border-radius:22px;box-shadow:var(--shadow-lg);padding:34px 30px 28px;box-sizing:border-box}
.login-logo-wrap{display:flex;justify-content:center;margin-bottom:6px}
.login-logo{width:min(210px,60%);height:auto;display:block}
.empire-brandbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brand-mark{width:52px;height:52px;flex:0 0 auto;border-radius:15px;background:transparent;display:flex;align-items:center;justify-content:center}
.brand-title{font-family:var(--font-head);font-weight:800;font-size:19px;line-height:1.15}
.brand-sub{font-size:12px;color:var(--muted)}
.hidden{display:none}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.gallery img{width:100%;height:140px;object-fit:cover;border-radius:12px;box-shadow:var(--shadow-sm)}
.msg{padding:12px 14px;border-radius:14px;background:var(--card2);margin:7px 0;box-shadow:var(--shadow-sm)}
.msg.mine{background:var(--a-soft)}
.notice{padding:12px 14px;border-left:4px solid var(--a);background:color-mix(in srgb, var(--a) 6%, var(--card));margin:7px 0;border-radius:10px}

.hero{padding:36px;border-radius:22px;background:linear-gradient(135deg,var(--b) 0%,var(--b2) 55%,var(--a2) 140%);color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(420px 220px at 88% -10%, rgba(245,197,66,.25), transparent 60%)}
.hero h1{font-family:var(--font-head);font-size:38px;margin:0 0 10px;position:relative}
.hero p{max-width:850px;font-size:16.5px;line-height:1.75;position:relative;opacity:.92}
.hero .row{position:relative}
.pill{display:inline-block;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.14);margin:3px;font-size:12.5px;font-weight:700;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12)}
.progress{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--a),var(--gold-bright));transition:width .4s ease}
.timeline{display:grid;gap:8px}
.step{display:grid;grid-template-columns:145px 1fr 75px;gap:12px;align-items:center;padding:11px;border-bottom:1px solid var(--line);border-radius:10px}
.step.done{background:color-mix(in srgb, var(--a) 8%, transparent)}
.step.current{background:color-mix(in srgb, var(--gold) 10%, transparent)}
.chartbox{height:280px}
.social a{display:inline-block;margin:4px;text-decoration:none;font-weight:700;color:var(--a2)}
.contact a{color:var(--a2);font-weight:700;text-decoration:none}
.tag{font-size:11px;font-weight:800;border-radius:7px;padding:4px 8px;background:var(--card2);border:1px solid var(--line)}
.empty{padding:30px;text-align:center;color:var(--muted)}
img,svg,canvas,video{max-width:100%}
.tabs{display:flex;flex-wrap:wrap;gap:7px;overflow:visible;margin-bottom:12px}
.tabs button{white-space:nowrap;flex:0 0 auto}
@media(max-width:750px){
  .layout{grid-template-columns:1fr}
  aside{display:flex;overflow:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;gap:2px;padding:10px 8px;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:20}
  .nav{width:auto;flex:0 0 auto}
  .nav.active::before{left:0;right:0;top:auto;bottom:0;left:10px;right:10px;width:auto;height:3px;border-radius:6px 6px 0 0}
  main{padding:16px}
  .brand{font-size:16.5px}
  .hero{padding:24px}
  .hero h1{font-size:27px}
  .step{grid-template-columns:1fr}
  .chartbox{height:230px}
  /* Zuia iOS Safari isi-zoom otomatiki unapobonyeza input (font chini ya 16px husababisha zoom) */
  input,select,textarea{font-size:16px}
  /* Majedwali makubwa yasukume ukurasa mzima kando - yatembee ndani ya card yake pekee */
  .card{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .card>table{min-width:480px}
}

.mapbox{height:320px;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-top:10px;box-shadow:var(--shadow-sm)}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.plan-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.plan-card img{width:100%;height:190px;object-fit:cover;border-radius:10px;background:var(--card2)}
.plan-card h3{margin:9px 0 5px}
.install-banner{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;display:none;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-lg);border-radius:16px;padding:14px}
.install-banner .row{margin:0}
.kpi{font-size:13px;color:var(--muted)}
@media(max-width:750px){.mapbox{height:280px}.plan-card img{height:160px}}
.fin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.fin-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm)}
.fin-card .lbl{font-size:11.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.fin-card .val{font-family:var(--font-head);font-size:24px;font-weight:800;margin-top:4px}
.fin-card.paid .val{color:var(--a2)}.fin-card.due .val{color:var(--danger)}.fin-card.over .val{color:var(--gold)}
.badge.overdue{background:var(--danger-soft);color:var(--danger)}.badge.paid{background:#dcfce7;color:#166534}.badge.unpaid{background:#fef3c7;color:#92400e}
:root[data-theme="dark"] .badge.paid{background:#0d2f22;color:#4ade80}
:root[data-theme="dark"] .badge.unpaid{background:#3a2b06;color:#fcd34d}
.searchbar{display:flex;gap:8px;margin-bottom:12px}.searchbar input{margin:0}
.offline-pill{padding:5px 12px;border-radius:99px;font-size:11px;font-weight:800}
.offline-pill.on{background:#dcfce7;color:#166534}.offline-pill.off{background:#fee2e2;color:#991b1b}
.icon-btn{padding:7px 11px;font-size:12px}
.inv-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
@media print{aside,header,.install-banner,#navBtns,.no-print{display:none!important}main{padding:0}.layout{display:block}body{background:#fff}}
/* === Kimataifa / Internationalization === */
.hdr-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hdr-tools select,.hdr-tools button{width:auto;margin:0;padding:8px 10px;font-size:12px;border-radius:9px}
.hdr-tools select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);box-shadow:none}
.hdr-tools select option{color:#111}
.hdr-tools button{background:rgba(255,255,255,.12);box-shadow:none;border:1px solid rgba(255,255,255,.2)}
.hdr-tools button:hover{background:rgba(255,255,255,.22)}
.icon-btn-sm{padding:7px 10px;font-size:12px;border-radius:9px}
/* Vipengele vya header (lugha/currency) visitumie 'width:100%' ya jumla ya fomu -
   vinahitaji ukubwa wa asili tu, la sivyo vinasukuma header (na ukurasa mzima)
   kuwa mpana kuliko skrini. */
.hdr-tools select{width:auto;margin:0;padding:7px 8px;font-size:12px;min-width:0}
.hdr-tools{flex-wrap:wrap;row-gap:8px}
@media(max-width:560px){
  .icon-btn-sm span{display:none}
  .hdr-tools select{max-width:78px}
}
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}
.kanban-col{background:var(--card2);border:1px solid var(--line);border-radius:var(--radius);padding:11px;min-height:80px}
.kanban-col h4{margin:2px 4px 10px;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:8px;box-shadow:var(--shadow-sm)}
.kcard b{display:block;font-size:13.5px}
.pri{font-size:10px;font-weight:800;border-radius:6px;padding:2px 7px;display:inline-block;margin-top:4px}
.pri.Low{background:#e0f2fe;color:#075985}.pri.Medium{background:#fef9c3;color:#854d0e}.pri.High{background:#ffedd5;color:#9a3412}.pri.Critical{background:#fee2e2;color:#991b1b}
.kcard .row{margin-top:7px;gap:5px}.kcard .row button{padding:5px 8px;font-size:11px}
.toast-wrap{position:fixed;right:14px;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9999;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.toast{background:var(--b);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:13.5px;max-width:min(320px,100%);animation:toastin .18s ease-out;border:1px solid rgba(255,255,255,.08);pointer-events:auto}
.toast.err{background:linear-gradient(135deg,#7f1d1d,#450a0a)}.toast.ok{background:linear-gradient(135deg,#065f46,#022c22)}
@keyframes toastin{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
.cmdk-backdrop{position:fixed;inset:0;background:rgba(4,7,16,.55);backdrop-filter:blur(2px);z-index:999;display:flex;align-items:flex-start;justify-content:center;padding-top:10vh}
.cmdk{background:var(--card);width:min(560px,92vw);border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden;border:1px solid var(--line)}
.cmdk input{margin:0;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px}
.cmdk-list{max-height:50vh;overflow:auto}
.cmdk-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
.cmdk-item:hover,.cmdk-item.sel{background:var(--a-soft)}
.ai-box{background:linear-gradient(135deg,var(--b),var(--a2) 150%);color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-md)}
.ai-box .small{opacity:.85}
.bcrumb{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.bcrumb button{background:none;border:0;color:var(--a2);cursor:pointer;padding:0;font:inherit;font-weight:700;box-shadow:none}
.portfolio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.portfolio-card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow .18s ease}
.portfolio-card:hover{box-shadow:var(--shadow-md)}
.portfolio-cover{width:100%;height:180px;object-fit:cover;background:var(--card2)}
.portfolio-body{padding:15px}
.stars{color:var(--gold);font-weight:800}
.file-meta{font-size:12px;color:var(--muted)}
@media(max-width:750px){.hdr-tools{width:100%;justify-content:flex-start}}

/* === GLOBAL CONSTRUCTION PLATFORM === */
.global-hero{background:linear-gradient(135deg,var(--b),var(--a2) 140%);color:#fff;border-radius:20px;padding:26px;margin-bottom:14px;box-shadow:var(--shadow-lg)}
.global-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.feature-card{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--card);box-shadow:var(--shadow-sm);transition:box-shadow .18s ease}
.feature-card:hover{box-shadow:var(--shadow-md)}
.score{font-family:var(--font-head);font-size:34px;font-weight:800;color:var(--a2)}
.timeline-mini{border-left:3px solid var(--a);padding-left:12px;margin:8px 0}
.status-open{color:#b45309}.status-closed{color:#15803d}

/* === PRODUCTION / SYSTEM === */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#16a34a;margin-right:6px;box-shadow:0 0 0 3px color-mix(in srgb, #16a34a 25%, transparent)}
.audit-item{padding:10px 0;border-bottom:1px solid var(--line)}
.warn-card{border-left:4px solid var(--gold)}
</style>

const K='smart_empire_pro_v2';

(function(){try{const OLD='jengo_msingi_pro_v2';if(!localStorage.getItem(K)&&localStorage.getItem(OLD)){localStorage.setItem(K,localStorage.getItem(OLD));localStorage.removeItem(OLD);}}catch(_){}})();
let state=JSON.parse(localStorage.getItem(K)||'null'),me=null,currentView=null;

// ================== FIREBASE (Cloud Database ya Pamoja) ==================
// JINSI YA KUWEZESHA: Nenda https://console.firebase.google.com -> "Add project" (bure)
// -> Bonyeza icon ya Web </> kuongeza Web App -> BANDIKA config uliyopewa hapa chini
// Kisha kwenye console: wezesha "Firestore Database" (Start in test mode) na "Storage" (Start in test mode)
// Mpaka ujaze config sahihi, mfumo utaendelea kufanya kazi LOCAL PEKEE (kifaa kimoja tu, kama zamani).
const firebaseConfig = {
  apiKey: "WEKA_API_KEY_YAKO",
  authDomain: "WEKA_AUTH_DOMAIN_YAKO",
  projectId: "WEKA_PROJECT_ID_YAKO",
  storageBucket: "WEKA_STORAGE_BUCKET_YAKO",
  messagingSenderId: "WEKA_SENDER_ID_YAKO",
  appId: "WEKA_APP_ID_YAKO"
};
let fbEnabled=firebaseConfig.apiKey!=='WEKA_API_KEY_YAKO', db=null, storage=null;
if(fbEnabled){
  try{
    firebase.initializeApp(firebaseConfig);
    db=firebase.firestore(); storage=firebase.storage();
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  }catch(e){console.warn('Firebase init imeshindikana',e);fbEnabled=false}
}
const STATE_DOC='app/state'; // hifadhi moja ya pamoja - kila mtu anasoma/kuandika hapa
let saveTimer=null;
function setCloudBadge(txt){let el=document.getElementById('cloudSync');if(el)el.textContent=txt}
function save(){
  localStorage.setItem(K,JSON.stringify(state));
  if(!fbEnabled){setCloudBadge('💾 Imehifadhiwa kwenye kifaa hiki');return}
  setCloudBadge('⏳ Inasawazisha...');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    db.doc(STATE_DOC).set(state).then(()=>setCloudBadge('☁️ Imesawazishwa')).catch(e=>{
      console.warn('sync error',e);
      if(String(e.message||'').toLowerCase().includes('exceeds maximum'))setCloudBadge('⚠️ Data imejaa (>1MB) - punguza picha');
      else setCloudBadge('⚠️ Tatizo la mtandao');
    });
  },500);
}
function attachCloudSync(){
  if(!fbEnabled)return;
  db.doc(STATE_DOC).onSnapshot(snap=>{
    if(!snap.exists){db.doc(STATE_DOC).set(state).catch(()=>{});return}
    if(snap.metadata.hasPendingWrites)return; // hii ni echo ya "save()" yetu wenyewe, si mabadiliko mapya
    state=snap.data();
    state.contracts=state.contracts||[];state.history=state.history||[];state.portfolio=state.portfolio||[];
    normalizeRoles();
    localStorage.setItem(K,JSON.stringify(state));
    setCloudBadge('☁️ Imesawazishwa');
    if(document.getElementById('shell')&&!document.getElementById('shell').classList.contains('hidden')){
      let ae=document.activeElement;
      if(ae&&['INPUT','TEXTAREA','SELECT'].includes(ae.tagName))return; // usisumbue mtu anapoandika
      renderCurrentView();
    }
  },err=>{console.warn(err);setCloudBadge('⚠️ Tatizo la mtandao')});
}
function renderCurrentView(){
  if(!currentView)return;
  if(currentView.fn==='ProjectDetail'){if(state.projects.find(p=>p.id===currentView.arg))project(currentView.arg);return}
  let btn=[...document.querySelectorAll('.nav')].find(x=>x.dataset.key===currentView.fn);
  go(currentView.fn,btn);
}
async function uploadToStorage(file,pathPrefix){
  if(!fbEnabled||!storage)return null;
  try{
    let ref=storage.ref().child(pathPrefix+'/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_'));
    await ref.put(file);
    return await ref.getDownloadURL();
  }catch(e){console.warn('Storage haipatikani (huenda Blaze plan haijawezeshwa) - tunatumia hifadhi mbadala',e);return null}
}
function fileToDataURL(file){return new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file)})}
function logHistory(action,details,project){
  state.history=state.history||[];
  state.history.unshift({id:id(),action,details,project:project||null,user:me?me.id:null,userName:me?me.name:'System',at:new Date().toISOString()});
  if(state.history.length>500)state.history.length=500;
}

let _seLastId=0;
function id(){let n=Date.now()*1000+Math.floor(Math.random()*1000);if(n<=_seLastId)n=_seLastId+1;_seLastId=n;return n}
/* ================== ROLES: ADMIN + BOSS PEKEE ==================

   (Roles za CLIENT na ENGINEER zimeondolewa; MANAGER -> BOSS.) */
const STAFF_ROLES=['ADMIN','BOSS'];
function isAdmin(){return !!me&&me.role==='ADMIN'}
function isBoss(){return !!me&&me.role==='BOSS'}
function isStaff(){return !!me&&STAFF_ROLES.includes(me.role)&&(me.status||'ACTIVE')==='ACTIVE'}
function staffUsers(){return ((state&&state.users)||[]).filter(u=>STAFF_ROLES.includes(u.role)&&(u.status||'ACTIVE')==='ACTIVE')}
function userName(uid){let u=((state&&state.users)||[]).find(x=>x.id===uid);return u?u.name:''}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

 let symbols={TZS:'TSh',USD:'$',KES:'KSh',UGX:'USh',RWF:'FRw',NGN:'₦',ZAR:'R',GBP:'£',EUR:'€',AED:'د.إ'};
 let dec=(cur==='TZS'||cur==='UGX'||cur==='RWF')?0:2;
 return (symbols[cur]||cur)+' '+val.toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec});
}

function toggleTheme(){

// ================== TOAST NOTIFICATIONS (badala ya alert kwa vitendo vipya) ==================
function toast(msg,kind){
 let w=document.getElementById('toastWrap');if(!w)return alert(msg);
 let el=document.createElement('div');el.className='toast'+(kind?' '+kind:'');el.textContent=msg;
 w.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .25s';setTimeout(()=>el.remove(),250)},3200);
}

// ================== GLOBAL SEARCH / COMMAND MENU (Ctrl+K) ==================
function openCmdK(){
 if(!me)return;
 let navKeys=[...document.querySelectorAll('.nav')].map(b=>b.dataset.key);
 let items=[...navKeys.map(x=>({type:'nav',label:t(x),go:x})),
   ...myProjects().map(p=>({type:'project',label:p.name,go:p.id}))];
 let back=document.createElement('div');back.className='cmdk-backdrop';back.id='cmdkBack';
 back.innerHTML=`<div class="cmdk"><input id="cmdkInput" placeholder="${t('Search')}..."><div class="cmdk-list" id="cmdkList"></div></div>`;
 back.onclick=e=>{if(e.target===back)back.remove()};
 document.body.appendChild(back);
 function renderList(q){
  q=(q||'').toLowerCase();
  let filtered=items.filter(i=>i.label.toLowerCase().includes(q));
  document.getElementById('cmdkList').innerHTML=filtered.map((i,idx)=>`<div class="cmdk-item" data-idx="${idx}" onclick="cmdkPick(${idx})">${i.type==='project'?'📁 ':'▸ '}${esc(i.label)}</div>`).join('')||'<div class="cmdk-item">—</div>';
  window._cmdkItems=filtered;
 }
 renderList('');
 let inp=document.getElementById('cmdkInput');inp.focus();
 inp.oninput=()=>renderList(inp.value);
 inp.onkeydown=e=>{if(e.key==='Escape')back.remove();if(e.key==='Enter'&&window._cmdkItems&&window._cmdkItems[0])cmdkPick(0)};
}
function cmdkPick(idx){
 let it=window._cmdkItems[idx];if(!it)return;
 document.getElementById('cmdkBack')?.remove();
 if(it.type==='project')project(it.go);else go(it.go,[...document.querySelectorAll('.nav')].find(b=>b.dataset.key===it.go));
}
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(me)openCmdK()}});

/* Hamisha data ya zamani kwenye mfumo wa roles mbili (ADMIN/BOSS). Salama kuiita mara nyingi. */
function normalizeRoles(){
 if(!state)return false;
 let changed=false;
 state.users=Array.isArray(state.users)?state.users:[];
 state.archivedUsers=Array.isArray(state.archivedUsers)?state.archivedUsers:[];
 const byId={};[...state.archivedUsers,...state.users].forEach(u=>{if(u&&u.id!=null)byId[u.id]=u});
 state.users.forEach(u=>{
  if(u.role==='MANAGER'){
   u.role='BOSS';changed=true;
  }
 });
 const removed=state.users.filter(u=>!STAFF_ROLES.includes(u.role));
 if(removed.length){
  const gone=new Set(removed.map(u=>u.id));
  removed.forEach(u=>{const {password,modules,...rest}=u;state.archivedUsers.push({...rest,archivedAt:new Date().toISOString(),archivedReason:'Role '+u.role+' imeondolewa'})});
  state.users=state.users.filter(u=>!gone.has(u.id));
  state.notifications=(state.notifications||[]).filter(n=>!gone.has(n.user));
  ['accountModules','activeProject','notificationPrefs'].forEach(k=>{if(state[k])gone.forEach(i=>delete state[k][i])});
  changed=true;
 }
 /* Hakuna tena akaunti ya Admin inayotengenezwa kiotomatiki: kama hakuna Admin halisi,
    mfumo unaonyesha skrini ya kuanzisha (ROLES v6 -> setupPage). */
 const staffIds=new Set(state.users.map(u=>u.id));
 const fallback=(state.users.find(u=>u.role==='BOSS'&&(u.status||'ACTIVE')==='ACTIVE')||state.users.find(u=>u.role==='ADMIN')||{}).id;
 (state.projects||[]).forEach(p=>{
  if('client' in p){
   const c=byId[p.client];
   if(c){if(!p.clientName)p.clientName=c.name||'';if(!p.clientPhone&&c.phone)p.clientPhone=c.phone;if(!p.clientEmail&&c.email)p.clientEmail=c.email}
   delete p.client;changed=true;
  }
  if('engineers' in p){delete p.engineers;changed=true}
  if(p.clientName===undefined){p.clientName='';changed=true}
  if(!staffIds.has(p.manager)&&fallback!==undefined){p.manager=fallback;changed=true}
 });
 (state.finInvoices||[]).forEach(i=>{
  if('client' in i){
   if(!i.clientName){const c=byId[i.client],p=(state.projects||[]).find(x=>x.id===i.project);i.clientName=(c&&c.name)||(p&&p.clientName)||''}
   delete i.client;changed=true;
  }
 });
 (state.contracts||[]).forEach(c=>(c.signatures||[]).forEach(sg=>{
  if(!sg.party){sg.party=sg.role==='CLIENT'?'CLIENT':(['ADMIN','MANAGER','BOSS'].includes(sg.role)?'COMPANY':'OTHER');changed=true}
  if(sg.role==='MANAGER'){sg.role='BOSS';changed=true}
  if(sg.role==='CLIENT'){sg.role='MTEJA';changed=true}
 }));
 (state.tasks||[]).forEach(k=>{
  if(k.assignee!=null&&!staffIds.has(k.assignee)){const u=byId[k.assignee];k.assigneeName=k.assigneeName||(u&&u.name)||'';k.assignee=null;changed=true}
 });
 return changed;
}

function renderProjectMap(){
  let el=document.getElementById('projectMap'); if(!el)return;
  if(typeof L==='undefined'){el.innerHTML='<div class="empty">Ramani haijapakia (angalia internet connection yako).</div>';return}
  if(window._jmMap){window._jmMap.remove();window._jmMap=null}
  let p=state.projects.find(x=>x.id===(Number(document.getElementById('mapProject')?.value)||0));
  if(!p||!p.lat||!p.lng){el.innerHTML='<div class="empty">Project hii haina latitude/longitude. Admin/Boss aongeze coordinates kwenye project.</div>';return}
  let lat=Number(p.lat),lng=Number(p.lng);
  try{
    window._jmMap=L.map(el).setView([lat,lng],15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap contributors © CARTO'}).addTo(window._jmMap);
    L.marker([lat,lng]).addTo(window._jmMap).bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.location||'Project location')}`).openPopup();
  }catch(mapErr){console.warn('Map render skipped:',mapErr);el.innerHTML='<div class="empty">Imeshindwa kupakia ramani.</div>'}
}

// ================== AI PROJECT SUMMARY (rule-based, hakuna gharama ya API) ==================
// Hii SI muunganiko wa moja kwa moja na Claude/AI ya nje - ni muhtasari unaotengenezwa
// kutoka kwa data ya project yenyewe (progress, invoices, milestones). Kwa muunganiko wa AI
// halisi (Anthropic API) inahitaji ufunguo wa API upande wa server - tazama maelezo mwishoni.
function aiProjectSummary(pid){
 let p=state.projects.find(x=>x.id===pid);if(!p)return'';
 let inv=(typeof finActiveInvoices==='function')?finActiveInvoices(pid):[];
 let unpaid=inv.reduce((s,i)=>s+finInvoiceOutstanding(i),0);
 let overdue=inv.filter(i=>finInvoiceStatus(i)==='OVERDUE');
 let nextMs=(p.milestones||[]).find(m=>m.status!=='DONE');
 let openDefects=(state.defects||[]).filter(d=>d.project===pid&&d.status!=='FIXED').length;
 let parts=[`Mradi wa ${p.name} umefikia ${p.progress}%${nextMs?' — hatua ya sasa: '+nextMs.name:''}.`];
 if(unpaid>0)parts.push(`Kuna ${money(unpaid)} ambazo bado hazijalipwa.`);
 if(overdue.length)parts.push(`Ankara ${overdue.length} zimechelewa kulipwa.`);
 if(openDefects)parts.push(`Kuna kasoro ${openDefects} ambazo bado hazijasahihishwa.`);
 if(nextMs&&nextMs.date)parts.push(`Hatua inayofuata (${nextMs.name}) imepangwa ${nextMs.date}.`);
 return parts.join(' ');
}

// ================== AI ASSISTANT HALISI (Anthropic API) ==================
// Funguo ya API inahifadhiwa KWENYE KIFAA/BROWSER HII TU (localStorage), HAITUMWI kwenye
// Firebase/database ya pamoja, ili watumiaji wengine wasiweze kuiona. Kwa matumizi ya
// PRODUCTION (mfumo wa kampuni yenye watumiaji wengi), funguo hii inapaswa kuwekwa kwenye
// server/backend (proxy) badala ya kwenye browser, kwa sababu mtu yeyote anayefungua
// "Developer Tools" ya browser anaweza kuiona funguo iliyowekwa hapa.
const AI_KEY_LS='jm_ai_key';
function getAiKey(){return localStorage.getItem(AI_KEY_LS)||''}
function setAiKeyLS(k){localStorage.setItem(AI_KEY_LS,k)}
async function callClaudeAI(prompt,systemPrompt){
 let key=getAiKey();
 if(!key){toast('Weka ufunguo wa Anthropic API kwenye Msaidizi wa AI kwanza','err');return null}
 try{
  let res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
   body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:systemPrompt||undefined,messages:[{role:'user',content:prompt}]})});
  let data=await res.json();
  if(data.error){toast('Hitilafu ya AI: '+data.error.message,'err');return null}
  return (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n').trim();
 }catch(e){console.warn(e);toast('Imeshindikana kuwasiliana na AI. Angalia mtandao au ufunguo wa API.','err');return null}
}
function projectContextForAI(pid){
 let p=state.projects.find(x=>x.id===pid);if(!p)return'{}';
 let inv=(typeof finInvoicesFor==='function')?finInvoicesFor(pid):[];
 let tasks=(state.tasks||[]).filter(x=>x.project===pid);
 let defects=(state.defects||[]).filter(x=>x.project===pid);
 let budget=(state.budgetItems||[]).filter(x=>x.project===pid);
 return JSON.stringify({name:p.name,status:p.status,progress:p.progress,budgetTZS:p.budget,location:p.location,
  milestones:p.milestones,invoices:inv.map(i=>({number:i.number,amountTZS:i.total,paidTZS:finInvoicePaid(i),status:finInvoiceStatus(i),dueDate:i.dueDate})),
  tasks:tasks.map(x=>({title:x.title,status:x.status,priority:x.priority,due:x.due})),
  defects:defects.map(x=>({title:x.title,status:x.status})),
  budgetItems:budget.map(x=>({code:x.code,plannedTZS:x.planned,actualTZS:x.actual}))});
}

let sigCtx=null,sigDrawing=false;
function initSigPad(){
 let c=document.getElementById('sigPad');if(!c)return;
 const ratio=Math.max(1,window.devicePixelRatio||1),r0=c.getBoundingClientRect();
 c.width=Math.round(r0.width*ratio);c.height=Math.round((r0.height||180)*ratio);
 sigCtx=c.getContext('2d');sigCtx.scale(ratio,ratio);sigCtx.lineWidth=2.4;sigCtx.lineCap='round';sigCtx.strokeStyle='#0f172a';
 function pos(e){let r=c.getBoundingClientRect();let t=e.touches?e.touches[0]:e;return {x:t.clientX-r.left,y:t.clientY-r.top}}
 function start(e){sigDrawing=true;let p=pos(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);e.preventDefault()}
 function move(e){if(!sigDrawing)return;let p=pos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();e.preventDefault()}
 function end(){sigDrawing=false}
 c.onmousedown=start;c.onmousemove=move;c.onmouseup=end;c.onmouseleave=end;
 c.ontouchstart=start;c.ontouchmove=move;c.ontouchend=end;
}

function createLabor(pid){

 let adv=Number(labAdvance.value||0);
 let rec={id:id(),project:pid,category:labCat.value,name,phone:labPhone.value.trim(),workCategory:labWork.value,workCategoryOther:labWork.value==='Nyingine'?labWorkOther.value.trim():'',duration:labDuration.value.trim(),totalPayment:Number(labTotal.value||0),paymentMethod:labMethod.value,bankOther:labMethod.value==='Benki Nyingine'?labBankOther.value.trim():'',account:labAccount.value.trim(),payments:[],updates:[{at:new Date().toISOString(),by:me.name,text:'Amesajiliwa ('+labType({category:labCat.value})+') — makubaliano '+moneyTZS(labTotal.value)}],createdAt:new Date().toISOString()};
 let payId=null;

function labSigData(){
 let c=document.getElementById('sigPad');if(!c)return null;
 let blank=document.createElement('canvas');blank.width=c.width;blank.height=c.height;
 if(c.toDataURL()===blank.toDataURL())return null;
 // punguza ukubwa wa picha ya sahihi ili isijaze storage
 let o=document.createElement('canvas');o.width=420;o.height=Math.round(420*c.height/c.width);
 let ctx=o.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,o.width,o.height);ctx.drawImage(c,0,0,o.width,o.height);
 return o.toDataURL('image/jpeg',0.7);
}
async function labStoreSig(dataUrl,lid){
 if(!fbEnabled)return dataUrl;
 try{let blob=await (await fetch(dataUrl)).blob();let ref=storage.ref().child('labor_signatures/'+lid+'_'+Date.now()+'.jpg');await ref.put(blob);return await ref.getDownloadURL()}catch(e){return dataUrl}
}
async function labSavePayment(lid,withSig){

 if(lpMethod.value==='Benki Nyingine'&&!lpBankOther.value.trim())return toast('Andika jina la benki','err');
 let bal=labBal(x);
 if(amt>bal&&!confirm('Kiasi hiki ('+moneyTZS(amt)+') kinazidi deni lililobaki ('+moneyTZS(bal)+'). Endelea?'))return;
 let sig='';
 if(withSig){let d=labSigData();if(!d)return toast('Tafadhali mpokeaji aweke sahihi kwenye kisanduku kwanza','err');sig=await labStoreSig(d,lid)}
 let p={id:id(),amount:amt,date:lpDate.value,method:lpMethod.value,bankOther:lpMethod.value==='Benki Nyingine'?lpBankOther.value.trim():'',account:lpAccount.value.trim(),reference:lpRef.value.trim(),note:lpNote.value.trim(),signature:sig,signedAt:sig?new Date().toISOString():'',recordedBy:me.name,recordedAt:new Date().toISOString()};
 labPayments(x).push(p);
 x.updates=x.updates||[];x.updates.push({at:new Date().toISOString(),by:me.name,text:'Malipo ya '+moneyTZS(amt)+' tarehe '+labFmtD(p.date)+' kupitia '+labMethodTxt(p.method,p.bankOther)+' — baki sasa '+moneyTZS(labBal(x))+(sig?' (imesainiwa)':' (haijasainiwa)')});
 logHistory('LABOR_PAYMENT',x.name+': '+moneyTZS(amt)+' ('+p.date+')',x.project);save();toast('Malipo yamehifadhiwa','ok');labDetail(lid);
}

  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap contributors © CARTO'}).addTo(_seWeatherMap);

async function loadWeatherAndMap(location){
  const map=initTZMap();
  const mapStatus=document.getElementById('mapStatus');
  const weatherBox=document.getElementById('weatherBox');
  if(!location){
    if(mapStatus)mapStatus.textContent='Inaonyesha ramani ya jumla ya Tanzania. Ongeza \'Location\' kwenye project ili ramani ielekeze eneo la mradi automatic.';
    return;
  }
  if(mapStatus)mapStatus.textContent='Inatafuta eneo la "'+location+'"...';
  try{
    const g=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(location));
    const gd=await g.json();
    if(!gd.results||!gd.results.length){
      if(mapStatus)mapStatus.textContent='Eneo halikupatikana kwenye ramani. Jaribu jina la mji lililo karibu zaidi (mf. "Mbeya" badala ya jina la mtaa).';
      if(weatherBox)weatherBox.innerHTML='<p class="muted">Imeshindwa kupata location. Jaribu jina la mji lililo karibu.</p>';
      return;
    }
    const r0=gd.results[0],latitude=r0.latitude,longitude=r0.longitude,name=r0.name,country=r0.country;
    if(map){
      map.setView([latitude,longitude],13);
      L.marker([latitude,longitude]).addTo(map).bindPopup('<b>'+esc(name)+(country?', '+esc(country):'')+'</b>').openPopup();
      setTimeout(function(){try{map.invalidateSize();}catch(e){}},150);
    }
    if(mapStatus)mapStatus.textContent='Eneo limepatikana automatic: '+name+(country?', '+country:'')+' ('+latitude.toFixed(3)+', '+longitude.toFixed(3)+').';
    await loadWeatherAt(latitude,longitude,name,country);
  }catch(err){
    if(mapStatus)mapStatus.textContent='Imeshindwa kupata ramani. Angalia mtandao wako.';
    if(weatherBox)weatherBox.innerHTML='<p class="muted">Imeshindwa kupata hali ya hewa. Angalia internet connection.</p>'
  }
}
/* ---------- Ushauri wa hali ya hewa (site advisory) ----------
   Kutoka data ya Open-Meteo (leo + siku 4 zijazo), tengeneza ushauri wa kawaida
   wa kimaeneo (siyo tiba/dharura) kuhusu kazi za site: mvua, upepo mkali, joto
   kali - ili msimamizi apange kazi vizuri (mf. kuahirisha kazi za nje, kufunika
   nyenzo, n.k). */
function finWeatherAdvice(current,daily){
  const advice=[];
  const codeIsRain=(code)=>[51,53,55,61,63,65,80,81,82,95,96,99].includes(code);
  const rainProbToday=(daily.precipitation_probability_max||[])[0]||0;
  const rainProbTomorrow=(daily.precipitation_probability_max||[])[1]||0;
  if(codeIsRain(current.weather_code)||rainProbToday>=60){
    advice.push({level:'danger',msg:'🌧️ Mvua inatarajiwa LEO ('+rainProbToday+'% uwezekano). Panga kuahirisha kazi za nje (zege, upakaji rangi, uchimbaji) na hakikisha vifaa/simenti vimefunikwa.'});
  }else if(rainProbToday>=30){
    advice.push({level:'warn',msg:'🌦️ Kuna uwezekano wa mvua kidogo leo ('+rainProbToday+'%). Andaa mipango mbadala kwa kazi za nje.'});
  }
  if(rainProbTomorrow>=60){
    advice.push({level:'warn',msg:'⚠️ Mvua kubwa inatarajiwa KESHO ('+rainProbTomorrow+'%). Panga mapema kuhamisha vifaa nyeti na kulinda maeneo ya kazi.'});
  }
  if(current.wind_speed_10m>=35){
    advice.push({level:'danger',msg:'💨 Upepo mkali sana ('+Math.round(current.wind_speed_10m)+' km/h). Epuka kazi za urefu (scaffolding, crane) leo.'});
  }else if(current.wind_speed_10m>=20){
    advice.push({level:'warn',msg:'💨 Upepo wa wastani ('+Math.round(current.wind_speed_10m)+' km/h). Kuwa makini na vifaa vyepesi/mabati wakati wa kazi za juu.'});
  }
  if(current.temperature_2m>=34){
    advice.push({level:'warn',msg:'🥵 Joto kali ('+Math.round(current.temperature_2m)+'°C). Hakikisha vibarua wanapata maji ya kutosha na mapumziko ya kivuli.'});
  }
  const heavyRainDays=(daily.time||[]).map((d,i)=>({d,prob:(daily.precipitation_probability_max||[])[i]||0})).filter(x=>x.prob>=60);
  if(heavyRainDays.length>=3){
    advice.push({level:'warn',msg:'📅 Wiki hii ina siku nyingi za mvua kubwa ('+heavyRainDays.length+' kati ya siku 5). Zingatia hili unapopanga ratiba ya wiki ya site.'});
  }
  if(!advice.length){
    advice.push({level:'info',msg:'✅ Hali ya hewa ni nzuri kwa kazi za site siku hizi 5 zijazo. Hakuna tahadhari maalum.'});
  }
  return advice;
}
async function loadWeatherAt(latitude,longitude,name,country){
 try{
  let w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=auto&forecast_days=5`);
  let wd=await w.json();
  let c=wd.current||{};
  let codes={0:'☀️ Jua kali',1:'🌤️ Mawingu kidogo',2:'⛅ Mawingu',3:'☁️ Mawingu mengi',45:'🌫️ Ukungu',51:'🌦️ Manyunyu',61:'🌧️ Mvua',63:'🌧️ Mvua ya kati',65:'🌧️ Mvua kubwa',80:'🌦️ Mvua za ghafla',95:'⛈️ Radi'};
  let box=document.getElementById('weatherBox');if(!box)return;
  const advice=finWeatherAdvice(c,wd.daily||{});
  box.innerHTML=`<div class="fin-card"><div class="lbl">${esc(name)}, ${esc(country||'')}</div><div class="val">${Math.round(c.temperature_2m)}°C</div><div class="small muted">${codes[c.weather_code]||'—'} • Unyevu ${c.relative_humidity_2m}% • Upepo ${Math.round(c.wind_speed_10m)} km/h</div></div>
  <div class="row" style="margin-top:10px">${(wd.daily?.time||[]).map((d,i)=>`<div class="notice" style="flex:1;min-width:90px;text-align:center"><b>${new Date(d).toLocaleDateString('sw',{weekday:'short'})}</b><br>${Math.round(wd.daily.temperature_2m_max[i])}° / ${Math.round(wd.daily.temperature_2m_min[i])}°<br><span class="small muted">☔ ${wd.daily.precipitation_probability_max[i]}%</span></div>`).join('')}</div>
  <div style="margin-top:12px"><h4 style="margin:0 0 6px">💡 Ushauri wa Kazi za Site</h4>${advice.map(a=>`<div class="fin-alert ${a.level==='danger'?'danger':(a.level==='warn'?'warn':'info')}">${a.msg}</div>`).join('')}</div>
  <p class="small muted" style="margin-top:8px">Chanzo: Open-Meteo. Ushauri huu ni wa kimaeneo/mwongozo tu — siyo tahadhari rasmi ya serikali.</p>`;
 }catch(err){let box=document.getElementById('weatherBox');if(box)box.innerHTML='<p class="muted">Imeshindwa kupata hali ya hewa. Angalia internet connection.</p>'}
}

      ['Application version',state.systemSettings.version,'good'],
      ['Cloud storage',cloud,fbEnabled?'good':'warn'],
      ['Password migration',authHash+'/'+state.users.length+' accounts','warn'],
      ['Backup snapshots',state.backups.length,state.backups.length?'good':'warn'],
      ['Maintenance mode',state.systemSettings.maintenance?'ON':'OFF',state.systemSettings.maintenance?'warn':'good']
    ];
    app.innerHTML=`<h1>🚀 Production Center</h1>
    <div class="notice">Hii ndiyo control center ya final deployment, data protection na operational health ya Smart Empire Platform System.</div>
    <div class="prod-grid">${checks.map(c=>`<div class="card"><div class="muted">${c[0]}</div><div class="metric ${c[2]==='good'?'status-good':'status-warn'}">${esc(c[1])}</div></div>`).join('')}</div>
    <div class="card"><h2>System Controls</h2>
    <div class="row"><button onclick="createBackup()">CREATE BACKUP</button><button class="alt" onclick="go('Launch Checklist')">OPEN LAUNCH CHECKLIST</button><button class="gold" onclick="toggleMaintenance()">TOGGLE MAINTENANCE MODE</button></div>
    <p class="small muted">Maintenance mode imehifadhiwa kama system setting. Kwa production ya kweli, backend/server middleware inapaswa kuizuia public traffic.</p></div>`;
  }

  window.createBackup=function(){
    let snapshot={id:id(),at:new Date().toISOString(),version:state.systemSettings.version,data:JSON.parse(JSON.stringify(state))};
    delete snapshot.data.backups;
    state.backups.unshift(snapshot);
    state.backups=state.backups.slice(0,10);
    audit?.('BACKUP_CREATED','Manual backup created');
    save();toast('Nakala ya akiba imeundwa','ok');productionCenter();
  };
  window.toggleMaintenance=function(){
    state.systemSettings.maintenance=!state.systemSettings.maintenance;
    audit?.('MAINTENANCE_CHANGED','Maintenance '+(state.systemSettings.maintenance?'enabled':'disabled'));
    save();productionCenter();
  };

  function backupRestore(){
    if(!adminOnly())return go('Dashboard');
    app.innerHTML=`<h1>💾 Backup & Restore</h1><div class="card">
      <h2>Backup Snapshots</h2>
      ${(state.backups||[]).map(b=>`<div class="notice"><b>${new Date(b.at).toLocaleString()}</b> • v${esc(b.version||'-')}<div class="row"><button onclick="restoreBackup(${b.id})">RESTORE</button><button class="alt" onclick="downloadBackup(${b.id})">DOWNLOAD JSON</button></div></div>`).join('')||'<div class="empty">Hakuna backup bado.</div>'}
      <hr><h3>Import Backup</h3><input id="backupFile" type="file" accept=".json,application/json"><button onclick="importBackup()">IMPORT JSON</button>
      <p class="small muted">Restore hubadilisha data ya sasa. Tumia backup iliyotengenezwa na mfumo huu.</p></div>`;
  }
  window.restoreBackup=function(bid){
    let b=state.backups.find(x=>x.id===bid);if(!b||!confirm('Una uhakika unataka kurejesha nakala hii ya akiba?'))return;
    let backups=state.backups;state=JSON.parse(JSON.stringify(b.data));state.backups=backups;save();toast('Nakala ya akiba imerejeshwa','ok');boot();
  };
  window.downloadBackup=function(bid){
    let b=state.backups.find(x=>x.id===bid);if(!b)return;
    downloadJSON(b,'smart-empire-backup-'+bid+'.json');
  };
  window.importBackup=async function(){
    let f=backupFile.files[0];if(!f)return toast('Chagua faili la nakala ya akiba','err');
    try{let x=JSON.parse(await f.text());let data=x.data||x;if(!data.users||!data.projects)throw new Error('Invalid');
      if(!confirm('Kuingiza kutabadilisha data ya sasa. Endelea?'))return;
      let backups=state.backups||[];state=data;state.backups=backups;save();toast('Nakala ya akiba imeingizwa','ok');boot();
    }catch(e){toast('Nakala ya akiba si sahihi','err')}
  };

  function privacyData(){
    app.innerHTML=`<h1>🔒 Privacy & Data Control</h1><div class="card">
      <label><input id="pa" type="checkbox" ${state.privacy.analytics?'checked':''}> Ruhusu matumizi ya analytics ya ndani</label>
      <label><input id="ppub" type="checkbox" ${state.privacy.portfolioPublic?'checked':''}> Ruhusu Portfolio/Case Studies zilizowekwa PUBLIC kuonekana kwenye discovery</label>
      <label>Data retention (days)</label><input id="pret" type="number" min="30" value="${Number(state.privacy.dataRetentionDays||365)}">
      <button onclick="savePrivacy()">SAVE PRIVACY SETTINGS</button>
    </div><div class="card"><h2>Data Portability</h2><p>Admin anaweza ku-export data ya mfumo kama JSON kwa backup, migration au archival.</p><button onclick="exportAllData()">EXPORT ALL DATA</button></div>`;
  }
  window.savePrivacy=function(){
    state.privacy={analytics:pa.checked,portfolioPublic:ppub.checked,dataRetentionDays:Math.max(30,Number(pret.value||365))};
    audit?.('PRIVACY_UPDATED','Privacy settings updated');save();toast('Privacy settings saved','ok');
  };
  window.exportAllData=function(){downloadJSON(state,'smart-empire-data-export.json');audit?.('DATA_EXPORTED','Full system data exported');save()};
  function downloadJSON(obj,name){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

  function launchChecklist(){
    if(!adminOnly())return go('Dashboard');
    let items=[
      ['Cloud database configured',!!fbEnabled],
      ['Backup created',(state.backups||[]).length>0],
      ['Password migration complete',state.users.every(u=>String(u.password||'').startsWith('sha256:'))],
      ['Privacy settings reviewed',!!state.privacy],
      ['Production environment selected',state.systemSettings.environment==='production'],
      ['Marketplace data available',(state.marketplace||state.professionals||[]).length>0],
      ['Portfolio data available',(state.portfolio||[]).length>0],
      ['Documents module initialized',Array.isArray(state.documents)],
      ['Audit trail active',Array.isArray(state.history)]
    ];
    let done=items.filter(x=>x[1]).length;
    app.innerHTML=`<h1>✅ Global Launch Checklist</h1><div class="card"><h2>Readiness: ${done}/${items.length}</h2><div class="progress"><div style="width:${Math.round(done/items.length*100)}%"></div></div><div class="step-list" style="margin-top:14px">${items.map((x,i)=>`<div class="step-item">${x[1]?'✅':'⚠️'} <b>${esc(x[0])}</b><div class="small muted">${x[1]?'Completed':'Action required before final launch'}</div></div>`).join('')}</div></div>
    <div class="card"><h2>External Production Dependencies</h2><p>Payment, SMS, WhatsApp, Email, AI na e-signature integrations zinahitaji credentials na server-side endpoints halisi. Mfumo huu umeweka integration readiness lakini secrets hazipaswi kuwekwa ndani ya HTML/browser.</p></div>`;
  }

  function developerAPI(){
    if(!adminOnly())return go('Dashboard');
    app.innerHTML=`<h1>🧩 Developer API & Integration Architecture</h1>
    <div class="card"><p>Kwa deployment ya production, front-end inapaswa kuwasiliana na backend/API salama badala ya kuweka API keys kwenye browser.</p>
    <div class="codebox">POST /api/auth/login
GET  /api/projects
POST /api/projects
GET  /api/portfolio/search?q=...
POST /api/payments/webhook
POST /api/documents/upload
POST /api/contracts/sign
POST /api/notifications/send
POST /api/ai/project-analysis</div></div>
    <div class="card"><h2>Recommended Production Boundary</h2><div class="prod-grid"><div><b>Frontend</b><p>Web/PWA/mobile clients</p></div><div><b>Backend</b><p>Authentication, permissions, business logic</p></div><div><b>Storage</b><p>Documents, images, BIM files</p></div><div><b>Workers/Webhooks</b><p>Payments, notifications, background jobs</p></div></div></div>`;
  }

  const oldBoot=boot;
  boot=function(){
    oldBoot();
    if(me&&me.role==='ADMIN'){
      ['Production Center','Backup & Restore','Privacy & Data','Launch Checklist','Developer API'].forEach(x=>{
        if(![...document.querySelectorAll('.nav')].some(b=>b.dataset.key===x)){
          let b=document.createElement('button');b.className='nav';b.dataset.key=x;b.textContent=x;b.onclick=()=>go(x,b);nav.appendChild(b);
        }
      });
    }
  };
  const oldGo=go;
  go=function(x,b){
    if(x==='Production Center'){currentView={fn:x,arg:null};return productionCenter()}
    if(x==='Backup & Restore'){currentView={fn:x,arg:null};return backupRestore()}
    if(x==='Privacy & Data'){currentView={fn:x,arg:null};return privacyData()}
    if(x==='Launch Checklist'){currentView={fn:x,arg:null};return launchChecklist()}
    if(x==='Developer API'){currentView={fn:x,arg:null};return developerAPI()}
    return oldGo(x,b);
  };
})();
</script>

<style id="layout-spacing-hotfix">
/* PAGE LAYOUT HOTFIX: remove oversized blank areas and vertical centering */
html,body{min-height:100%;height:auto!important}
main,#app,.app,.content,.page,.view,.workspace{min-height:0!important}
#app{
  display:block!important;
  padding-top:0!important;

.shell,main{align-items:stretch!important;justify-content:flex-start!important}
.card,.panel{margin-top:0!important}
h1:first-child,h2:first-child{margin-top:0!important}
.empty{min-height:0!important;padding:24px!important}
@media (min-width: 700px){
  #app{padding:22px 26px 36px!important}
}
@media (max-width: 699px){
  #app{padding:16px 14px 28px!important}
}
/* Catch inline page renderers that use spacer-like top gaps */
[style*="margin-top: 80px"],[style*="margin-top:80px"],
[style*="padding-top: 80px"],[style*="padding-top:80px"]{
  margin-top:0!important;padding-top:0!important;
}
</style>
<script>
(function(){
  // Remove common vertical-centering utility classes when pages are rendered.
  function fixPageSpacing(){
    const root=document.getElementById('app');
    if(!root)return;
    root.style.removeProperty('min-height');
    root.style.setProperty('justify-content','flex-start','important');
    root.style.setProperty('align-items','stretch','important');
    [...root.querySelectorAll('*')].forEach(el=>{
      const cs=getComputedStyle(el);
      if((cs.display==='flex'||cs.display==='grid') && cs.minHeight!=='0px'){
        const r=el.getBoundingClientRect(), parent=root.getBoundingClientRect();
        if(r.top-parent.top>180 && el.children.length>0){
          el.style.setProperty('min-height','0','important');
          el.style.setProperty('justify-content','flex-start','important');
          el.style.setProperty('align-items','stretch','important');
        }
      }
    });
  }
  const oldGo=window.go;
  if(typeof oldGo==='function'){
    window.go=function(){
      const result=oldGo.apply(this,arguments);
      requestAnimationFrame(fixPageSpacing);
      setTimeout(fixPageSpacing,60);
      return result;
    }
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(fixPageSpacing,100));
  window.addEventListener('load',()=>setTimeout(fixPageSpacing,100));
})();
</script>

      if(m&&typeof window[m[1]]!=='function'&&typeof eval(m[1])!=='function')broken.push(m[1]);
    });
    return {ok:[...new Set(broken)].length===0,broken:[...new Set(broken)]};
  };

<script>
(function(){
  const REMOVE=new Set(['Career','Career & Jobs','Defect','Defects','Information','Acknowledgement','Acknowledgment','Security System','Security & Integrations','Production Readline','Production Readiness','Production Center','Backup & Restore','Privacy & Data','Launch Checklist','Developer API','System Test','AI Assistant','Maps & House Plans','Messages','Safety']);
  const MODULES=['Company','Dashboard','Projects','Tasks','Budget','Documents','Updates','Notifications','Site Visits','Gallery','Invoices & Payments','Contracts','History','Management','Portfolio & Research','Activities','Labor & Engineers','Materials & Expenses','Financial Management'];
  const DEFAULT={
    ADMIN:MODULES.slice(),
    BOSS:MODULES.slice()
  };
  window.SMART_EMPIRE_MODULES=MODULES;
  function safeModules(u){return u.role==='ADMIN'?MODULES.slice():(Array.isArray(u.modules)&&u.modules.length?u.modules:DEFAULT[u.role]||DEFAULT.BOSS).filter(x=>MODULES.includes(x));}
  state.users=state.users||[]; state.accountModules=state.accountModules||{};
  state.users.forEach(u=>{u.modules=safeModules(u);state.accountModules[u.id]=u.modules.slice()});
  try{save()}catch(e){}
  function can(m){return me&&me.role==='ADMIN'||(me&&safeModules(me).includes(m));}

  /* Remove unwanted navigation items even if an older script added them. */
  function cleanNav(){
    if(Array.isArray(menus)){
      for(let i=menus.length-1;i>=0;i--)if(REMOVE.has(menus[i]))menus.splice(i,1);
      const unique=[...new Set(menus.filter(x=>MODULES.includes(x)))];menus.length=0;unique.forEach(x=>menus.push(x));
    }
    document.querySelectorAll('.nav,[data-key]').forEach(el=>{let k=el.getAttribute('data-key')||el.textContent.trim();if([...REMOVE].some(x=>k===x||k.includes(x)))el.remove()});
  }
  window.cleanSmartEmpireNav=cleanNav;

  /* admin() -> ROLES v6. */
  window.renderAccountModules=function(){
    const sel=document.getElementById('seAccount'),box=document.getElementById('seAccountModules');if(!sel||!box)return;
    const u=state.users.find(x=>String(x.id)===String(sel.value));if(!u){box.innerHTML='';return}
    const current=new Set(safeModules(u));
    box.innerHTML=`<div class="se-save-note">${esc(u.name)} — <b>${esc(u.role)}</b></div><div class="se-module-grid">${MODULES.map(m=>`<label><input class="se-mod" type="checkbox" value="${esc(m)}" ${current.has(m)?'checked':''}> ${navIcons[m]||'▸'} ${esc(t(m))}</label>`).join('')}</div><div class="se-actions" style="margin-top:10px"><button class="alt" onclick="setAllModules(true)">WAPE ZOTE</button><button class="alt" onclick="setAllModules(false)">ONDOA ZOTE</button><button onclick="saveAccountModules()">💾 HIFADHI</button></div>`;
  };
  window.setAllModules=function(v){document.querySelectorAll('.se-mod').forEach(x=>x.checked=v)};
  window.saveAccountModules=function(){
    if(!me||me.role!=='ADMIN')return;
    const sel=document.getElementById('seAccount'),u=state.users.find(x=>String(x.id)===String(sel?.value));if(!u)return;
    u.modules=[...document.querySelectorAll('.se-mod:checked')].map(x=>x.value).filter(x=>MODULES.includes(x));
    state.accountModules[u.id]=u.modules.slice();save();toast('Module access imehifadhiwa.','ok');admin();
  };
  /* seAddStaff(), projectForm() -> ROLES v6. */

  /* Materials & expenses -> daftari moja la Matumizi (ROLES v6). */
  /* auth(), project chart, go() na boot() -> ROLES v6 (mwishoni mwa faili). */
})();
</script>

  if(!p)return p;
  if(p.contractNumber===undefined) p.contractNumber='CN-'+p.id;
  if(p.plannedCost===undefined) p.plannedCost=Math.round(Number(p.budget||0)*0.8);
  if(p.vatPercent===undefined) p.vatPercent=18;
  if(p.retentionPercent===undefined) p.retentionPercent=5;
  if(p.costToComplete===undefined) p.costToComplete=0;
  if(p.financialClosed===undefined) p.financialClosed=false;
  return p;
}

function finBudgetRow(pid,cat){

/* ---------- 4) CHANGE ORDERS / EXPENSES / INVOICES / PAYMENTS - queries ---------- */
function finApprovedCOs(pid){return (state.finChangeOrders||[]).filter(c=>c.project===pid&&c.status==='APPROVED');}
function finExpensesFor(pid){return (state.finExpenses||[]).filter(x=>x.project===pid);}
function finCountedExpenses(pid){return finExpensesFor(pid).filter(x=>x.status==='APPROVED'||x.status==='PAID');}
function finPaidExpenses(pid){return finExpensesFor(pid).filter(x=>x.status==='PAID');}
function finInvoicesFor(pid){return (state.finInvoices||[]).filter(x=>x.project===pid);}
function finActiveInvoices(pid){return finInvoicesFor(pid).filter(x=>x.state!=='DRAFT'&&x.state!=='CANCELLED');}
function finPaymentsForInvoice(invId){return (state.finPayments||[]).filter(x=>x.invoice===invId);}
function finPaymentsForProject(pid){return (state.finPayments||[]).filter(x=>x.project===pid);}
function finInvoicePaid(inv){return finPaymentsForInvoice(inv.id).reduce((s,x)=>s+Number(x.amount||0),0);}
function finInvoiceOutstanding(inv){return Math.max(0,Number(inv.total||0)-finInvoicePaid(inv));}
function finInvoiceStatus(inv){
  if(inv.state==='CANCELLED')return 'CANCELLED';
  if(inv.state==='DRAFT')return 'DRAFT';
  const paid=finInvoicePaid(inv), total=Number(inv.total||0);
  const overdue=inv.dueDate && new Date(inv.dueDate) < new Date(new Date().toDateString());
  if(paid<=0.009) return overdue?'OVERDUE':'ISSUED';
  if(paid<total-0.5) return overdue?'OVERDUE':'PARTIALLY_PAID';
  return 'PAID';
}

/* ---------- 5) CORE FINANCIAL FORMULAS (centralised) ---------- */
function finCategoryBreakdown(pid){
  const counted=finCountedExpenses(pid);
  return FIN_CATEGORIES.map(cat=>{
    const planned=Number(finBudgetRow(pid,cat).planned||0);
    const actual=counted.filter(x=>x.category===cat).reduce((s,x)=>s+Number(x.amount||0),0);
    const remaining=planned-actual, variance=planned-actual;
    const utilization=planned>0?(actual/planned*100):(actual>0?999:0);
    return {category:cat,planned,actual,remaining,variance,utilization,over:actual>planned+0.5};
  });
}
function finCalc(pid){
  const p=finProject(pid); if(!p)return null;
  const cos=finApprovedCOs(pid);
  const coAddCost=cos.reduce((s,c)=>s+Number(c.additionalCost||0),0);
  const coAddRev=cos.reduce((s,c)=>s+Number(c.additionalRevenue||0),0);
  const contractValue=Number(p.budget||0)+coAddRev;
  const plannedCost=Number(p.plannedCost||0)+coAddCost;
  const actualCost=finCountedExpenses(pid).reduce((s,x)=>s+Number(x.amount||0),0);
  const cashOut=finPaidExpenses(pid).reduce((s,x)=>s+Number(x.amount||0),0);
  const remainingBudget=plannedCost-actualCost;
  const budgetUtilization=plannedCost>0?(actualCost/plannedCost*100):0;
  const currentProfit=contractValue-actualCost;
  const currentProfitMargin=contractValue>0?(currentProfit/contractValue*100):0;
  const costToComplete=Number(p.costToComplete||0);
  const forecastFinalCost=actualCost+costToComplete;
  const forecastProfit=contractValue-forecastFinalCost;
  const forecastProfitMargin=contractValue>0?(forecastProfit/contractValue*100):0;
  const invs=finActiveInvoices(pid);
  const totalInvoiced=invs.reduce((s,x)=>s+Number(x.total||0),0);
  const totalPaid=invs.reduce((s,x)=>s+finInvoicePaid(x),0);
  const outstanding=totalInvoiced-totalPaid;
  const cashIn=totalPaid, netCashFlow=cashIn-cashOut;
  const expectedProfit=contractValue-plannedCost;
  const expectedMargin=contractValue>0?(expectedProfit/contractValue*100):0;
  let statusKey='PROFITABLE',statusLabel='PROFITABLE';
  if(actualCost>contractValue+0.5){statusKey='LOSS_INCURRED';statusLabel='LOSS INCURRED';}
  else if(forecastFinalCost>contractValue+0.5){statusKey='LOSS_PROJECTED';statusLabel='LOSS PROJECTED';}
  else if(Math.abs(forecastFinalCost-contractValue)<=0.5){statusKey='BREAK_EVEN';statusLabel='BREAK-EVEN';}
  else if(forecastProfitMargin<10){statusKey='AT_RISK';statusLabel='AT RISK';}
  return {p,contractValue,plannedCost,actualCost,cashOut,remainingBudget,budgetUtilization,currentProfit,currentProfitMargin,costToComplete,forecastFinalCost,forecastProfit,forecastProfitMargin,totalInvoiced,totalPaid,outstanding,cashIn,netCashFlow,expectedProfit,expectedMargin,statusKey,statusLabel,coAddCost,coAddRev};
}

/* ---------- 6) AUDIT TRAIL + SNAPSHOTS (for trend charts) ---------- */
function finLogAudit(pid,entity,entityId,action,prev,next){
  state.finAudit=state.finAudit||[];
  state.finAudit.unshift({id:id(),project:pid,entity,entityId,action,by:me?me.id:null,byName:me?me.name:'System',at:new Date().toISOString(),prev:prev===undefined?null:prev,next:next===undefined?null:next});
  if(state.finAudit.length>1000)state.finAudit.length=1000;
}
function finSnapshot(pid){
  const c=finCalc(pid); if(!c)return;
  state.finSnapshots=state.finSnapshots||[];
  const today=new Date().toISOString().slice(0,10);
  let row=state.finSnapshots.find(s=>s.project===pid&&s.date===today);
  if(!row){row={id:id(),project:pid,date:today};state.finSnapshots.push(row);}
  Object.assign(row,{actualCost:c.actualCost,forecastFinalCost:c.forecastFinalCost,forecastProfit:c.forecastProfit,contractValue:c.contractValue});
}

/* ---------- 7) ALERTS ---------- */
function finAlerts(pid){
  const c=finCalc(pid), cats=finCategoryBreakdown(pid), out=[];
  cats.forEach(cat=>{
    if(cat.planned>0){
      if(cat.over) out.push({level:'danger',msg:'Bajeti ya '+finCatLabel(cat.category)+' imezidi kwa '+money(cat.actual-cat.planned)+' ('+Math.round(cat.utilization)+'%).'});
      else if(cat.utilization>=80) out.push({level:'warn',msg:'Bajeti ya '+finCatLabel(cat.category)+' imetumika '+Math.round(cat.utilization)+'%.'});
    }
  });
  if(c.forecastFinalCost>c.contractValue) out.push({level:'danger',msg:'ONYO: Mradi unatarajiwa kupata HASARA (gharama inayotarajiwa inazidi thamani ya mkataba).'});
  else if(c.expectedProfit>0 && c.forecastProfit<c.expectedProfit*0.7) out.push({level:'warn',msg:'Faida inayotarajiwa imepungua kutoka '+money(c.expectedProfit)+' hadi '+money(c.forecastProfit)+'.'});
  finInvoicesFor(pid).forEach(i=>{if(finInvoiceStatus(i)==='OVERDUE')out.push({level:'danger',msg:'Ankara '+i.number+' imechelewa kulipwa.'});});
  if(c.netCashFlow<0) out.push({level:'danger',msg:'Mradi una mtiririko hasi wa fedha wa '+money(Math.abs(c.netCashFlow))+'.'});
  return out;
}

function finSaveSetup(pid){
  const p=finProject(pid);
  const prev={budget:p.budget,plannedCost:p.plannedCost,vatPercent:p.vatPercent,retentionPercent:p.retentionPercent,costToComplete:p.costToComplete};
  p.contractNumber=document.getElementById('fsNum').value.trim()||p.contractNumber;
  p.budget=Math.max(0,Number(document.getElementById('fsCV').value||0));
  p.plannedCost=Math.max(0,Number(document.getElementById('fsPC').value||0));
  p.vatPercent=Number(document.getElementById('fsVat').value||0);
  p.retentionPercent=Number(document.getElementById('fsRet').value||0);
  p.costToComplete=Math.max(0,Number(document.getElementById('fsCTC').value||0));
  finLogAudit(pid,'PROJECT',pid,'FINANCIAL_SETUP_UPDATED',prev,{budget:p.budget,plannedCost:p.plannedCost,vatPercent:p.vatPercent,retentionPercent:p.retentionPercent,costToComplete:p.costToComplete});
  finSnapshot(pid);save();toast('Mipangilio ya fedha imehifadhiwa ✓','ok');financeHub(pid,'dashboard');
}
function finCloseProject(pid){
  if(!isStaff())return toast('Admin au Boss pekee anaweza kufunga rekodi za kifedha.','err');
  const p=finProject(pid),c=finCalc(pid);
  if(!confirm('Una uhakika unataka KUFUNGA rekodi za kifedha za mradi huu? Baada ya hapo hazitabadilika mpaka zifunguliwe tena na Admin.'))return;
  p.financialClosed=true;
  state.finClosings=state.finClosings||[];
  state.finClosings.push({id:id(),project:pid,closedAt:new Date().toISOString(),closedBy:me.id,finalContractValue:c.contractValue,finalInvoiced:c.totalInvoiced,finalReceived:c.totalPaid,finalCost:c.actualCost,finalProfit:c.currentProfit,finalMargin:c.currentProfitMargin,totalOutstanding:c.outstanding,totalVariations:c.coAddRev-c.coAddCost});
  finLogAudit(pid,'PROJECT',pid,'FINANCIAL_CLOSED',false,true);save();toast('Rekodi za kifedha zimefungwa ✓','ok');financeHub(pid,'dashboard');
}
function finReopenProject(pid){
  if(!isStaff())return toast('Admin au Boss pekee.','err');
  const p=finProject(pid);p.financialClosed=false;
  finLogAudit(pid,'PROJECT',pid,'FINANCIAL_REOPENED',true,false);save();toast('Rekodi zimefunguliwa tena.','ok');financeHub(pid,'dashboard');
}

function finKillChart(el){try{const old=Chart.getChart(el);if(old)old.destroy();}catch(e){}}
function finRenderCharts(pid){
  if(typeof Chart==='undefined')return;
  const c=finCalc(pid), cats=finCategoryBreakdown(pid).filter(x=>x.planned>0||x.actual>0);
  let el=document.getElementById('finChartBA');
  if(el){finKillChart(el);try{new Chart(el,{type:'bar',data:{labels:cats.map(x=>finCatLabel(x.category)),datasets:[{label:'Bajeti',data:cats.map(x=>x.planned),backgroundColor:'#0f9d80'},{label:'Halisi',data:cats.map(x=>x.actual),backgroundColor:'#f5c542'}]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{ticks:{autoSkip:false,maxRotation:40}}}}});}catch(e){console.warn(e);}}
  el=document.getElementById('finChartRC');
  if(el){finKillChart(el);try{new Chart(el,{type:'bar',data:{labels:['Mapato ya Mkataba','Gharama Halisi','Gharama Inayotarajiwa'],datasets:[{data:[c.contractValue,c.actualCost,c.forecastFinalCost],backgroundColor:['#0b1020','#dc2626','#c9932f']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});}catch(e){console.warn(e);}}
  el=document.getElementById('finChartCT');
  if(el){finKillChart(el);
    const exps=finCountedExpenses(pid).slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
    let run=0;const pts=exps.map(x=>{run+=Number(x.amount||0);return {x:x.date,y:run};});
    try{new Chart(el,{type:'line',data:{labels:pts.map(pp=>pp.x),datasets:[{label:'Gharama Halisi (Jumla Inayoongezeka)',data:pts.map(pp=>pp.y),borderColor:'#0f9d80',backgroundColor:'rgba(15,157,128,.15)',fill:true,tension:.25}]},options:{responsive:true,maintainAspectRatio:false}});}catch(e){console.warn(e);}}
  el=document.getElementById('finChartPT');
  if(el){finKillChart(el);
    const snaps=(state.finSnapshots||[]).filter(s=>s.project===pid).sort((a,b)=>a.date.localeCompare(b.date));
    const labels=snaps.length?snaps.map(s=>s.date):['Sasa'];
    const data=snaps.length?snaps.map(s=>s.forecastProfit):[c.forecastProfit];
    try{new Chart(el,{type:'line',data:{labels,datasets:[{label:'Faida Inayotarajiwa',data,borderColor:'#c9932f',backgroundColor:'rgba(201,147,47,.15)',fill:true,tension:.25}]},options:{responsive:true,maintainAspectRatio:false}});}catch(e){console.warn(e);}}
  el=document.getElementById('finChartCF');
  if(el){finKillChart(el);
    const months={};
    finPaymentsForProject(pid).forEach(x=>{const m=(x.date||'').slice(0,7)||'—';months[m]=months[m]||{in:0,out:0};months[m].in+=Number(x.amount||0);});
    finPaidExpenses(pid).forEach(x=>{const m=(x.date||'').slice(0,7)||'—';months[m]=months[m]||{in:0,out:0};months[m].out+=Number(x.amount||0);});
    const keys=Object.keys(months).sort();
    try{new Chart(el,{type:'bar',data:{labels:keys,datasets:[{label:'Pesa Iliyoingia',data:keys.map(k=>months[k].in),backgroundColor:'#0f9d80'},{label:'Pesa Iliyotoka',data:keys.map(k=>months[k].out),backgroundColor:'#dc2626'}]},options:{responsive:true,maintainAspectRatio:false}});}catch(e){console.warn(e);}}
  el=document.getElementById('finChartInv');
  if(el){finKillChart(el);
    const invs=finInvoicesFor(pid).filter(i=>i.state!=='DRAFT'&&i.state!=='CANCELLED');
    const counts={PAID:0,PARTIALLY_PAID:0,ISSUED:0,OVERDUE:0};
    invs.forEach(i=>{const s=finInvoiceStatus(i);counts[s]=(counts[s]||0)+1;});
    try{new Chart(el,{type:'doughnut',data:{labels:['Imelipwa','Imelipwa Sehemu','Haijalipwa','Imechelewa'],datasets:[{data:[counts.PAID,counts.PARTIALLY_PAID,counts.ISSUED,counts.OVERDUE],backgroundColor:['#16a34a','#f5c542','#64748b','#dc2626']}]},options:{responsive:true,maintainAspectRatio:false}});}catch(e){console.warn(e);}}
}

function finInRange(dateStr,filter){
  if(!dateStr)return false; if(filter==='all')return true;
  const d=new Date(dateStr), now=new Date();
  if(filter==='today')return d.toDateString()===now.toDateString();
  if(filter==='week'){const wk=new Date(now);wk.setDate(now.getDate()-7);return d>=wk;}
  if(filter==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
  if(filter==='quarter'){const q=new Date(now);q.setMonth(now.getMonth()-3);return d>=q;}
  return true;
}
function finRenderTimeline(pid,filter){

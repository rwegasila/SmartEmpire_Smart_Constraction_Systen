      +'<div class="fin-card"><div class="lbl">Contract Value</div><div class="val">'+money(p.budget)+'</div></div>'
      +'<div class="fin-card"><div class="lbl">Planned Cost</div><div class="val">'+money(p.plannedCost)+'</div></div>'
      +'<div class="fin-card paid"><div class="lbl">Expected Profit</div><div class="val">'+money(Number(p.budget||0)-Number(p.plannedCost||0))+'</div></div>'
      +'</div>';
    if(can) html+='<div class="row" style="margin-top:12px"><button class="alt" onclick="finReopenContract('+pid+')">🔓 FUNGUA MKATABA TENA</button></div>';
  } else if(!can){
    html+='<div class="notice">Mkataba bado haujasainiwa. Muulize Admin au Boss akamilishe taarifa za mkataba na kuusaini kabla ya bajeti kupangwa.</div>';
  } else {
    html+='<p class="se-small">Jaza taarifa za mkataba, kisha usainishe hapa chini ili kufungua upangaji wa bajeti.</p>'
      +'<label>Contract Number</label><input id="ctNum" value="'+esc(p.contractNumber)+'">'
      +'<label>Contract Value / Thamani ya Mkataba (TZS)</label><input id="ctCV" type="number" value="'+(p.budget||0)+'">'
      +'<label>Planned Project Cost / Bajeti Iliyopangwa (TZS)</label><input id="ctPC" type="number" value="'+(p.plannedCost||0)+'">'
      +'<label>VAT %</label><input id="ctVat" type="number" value="'+p.vatPercent+'">'
      +'<label>Retention %</label><input id="ctRet" type="number" value="'+p.retentionPercent+'">'
      +'<div class="notice">Expected Profit = Contract Value − Planned Cost (itaonekana kwenye Dashibodi baada ya kusaini).</div>'
      +'<button onclick="finSaveContractDraft('+pid+')">HIFADHI TAARIFA ZA MKATABA</button>';
  }
  html+='</div>';
  if(signed&&(p.contractSignatureType==='digital'&&p.contractSignatureData||p.contractSignatureFile)){
    html+='<div class="card"><h3>✍️ Sahihi Iliyowekwa</h3>';
    if(p.contractSignatureType==='digital'&&p.contractSignatureData){
      html+='<img src="'+p.contractSignatureData+'" style="max-width:320px;width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;display:block">';
    }
    if(p.contractSignatureFile){
      html+='<p class="small" style="margin-top:'+(p.contractSignatureType==='digital'?'10px':'0')+'"><button class="alt icon-btn" onclick="seOpenFile(finProject('+pid+').contractSignatureFile,\'mkataba\')">📎 Ona nyaraka ya mkataba uliosainiwa</button></p>';
    }
    html+='</div>';
  }
  if(!signed && can){
    html+='<div class="grid">'
      +'<div class="card"><h3>✍️ Saini Kidijitali</h3><p class="se-small">Chora sahihi kwa kidole (simu) au kipanya (kompyuta).</p><canvas id="ctSigPad" class="ct-sig-canvas"></canvas><div class="row"><button onclick="finSaveContractSignature('+pid+')">HIFADHI SAINI</button><button class="alt" onclick="finClearContractSig()">FUTA</button></div></div>'
      +'<div class="card"><h3>🖊️ Thibitisha Saini ya Mkono</h3><p class="se-small">Kama mkataba umesainiwa kwa karatasi (manual), thibitisha hapa.</p><label>Jina la aliyesaini</label><input id="ctManualName" placeholder="Jina kamili"><label>Tarehe ya kusaini</label><input id="ctManualDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"><label>Picha/Scan ya mkataba uliosainiwa (hiari)</label><input id="ctManualFile" type="file" accept="image/*,.pdf"><button onclick="finConfirmManualSignature('+pid+')">THIBITISHA MKATABA UMESAINIWA</button></div>'
      +'</div>';
  }
  body.innerHTML=html;
  if(!signed && can) setTimeout(function(){finInitContractSigPad();},30);
}
function finInitContractSigPad(){
  const c=document.getElementById('ctSigPad'); if(!c) return;
  const ratio=Math.max(1,window.devicePixelRatio||1), r=c.getBoundingClientRect();
  c.width=Math.round(r.width*ratio); c.height=Math.round((r.height||160)*ratio);
  ctSigCtx=c.getContext('2d'); ctSigCtx.scale(ratio,ratio); ctSigCtx.lineWidth=2.5; ctSigCtx.lineCap='round'; ctSigCtx.strokeStyle='#002756';
  function pos(e){const rr=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return {x:t.clientX-rr.left,y:t.clientY-rr.top};}
  function start(e){ctSigDrawing=true;const p=pos(e);ctSigCtx.beginPath();ctSigCtx.moveTo(p.x,p.y);e.preventDefault();}
  function move(e){if(!ctSigDrawing)return;const p=pos(e);ctSigCtx.lineTo(p.x,p.y);ctSigCtx.stroke();e.preventDefault();}
  function end(){ctSigDrawing=false;}
  c.onmousedown=start;c.onmousemove=move;c.onmouseup=end;c.onmouseleave=end;
  c.ontouchstart=start;c.ontouchmove=move;c.ontouchend=end;
}
function finClearContractSig(){const c=document.getElementById('ctSigPad');if(c&&ctSigCtx)ctSigCtx.clearRect(0,0,c.width,c.height);}
function finSaveContractSignature(pid){
  const c=document.getElementById('ctSigPad'); if(!c) return;
  const blank=document.createElement('canvas'); blank.width=c.width; blank.height=c.height;
  if(c.toDataURL()===blank.toDataURL()) return toast('Chora sahihi kwenye kisanduku kwanza','err');
  const p=finProject(pid);
  p.contractSigned=true; p.contractSignatureType='digital'; p.contractSignatureData=c.toDataURL('image/png'); p.contractSignedBy=me.id; p.contractSignedByName=me.name; p.contractSignedAt=new Date().toISOString();
  finLogAudit(pid,'CONTRACT',pid,'SIGNED_DIGITAL',false,true);
  save(); toast('Mkataba umesainiwa kidijitali ✓ Sasa unaweza kupanga bajeti.','ok'); financeHub(pid,'contract');
}
async function finConfirmManualSignature(pid){
  const nameEl=document.getElementById('ctManualName'); const name=nameEl?nameEl.value.trim():'';
  if(!name) return toast('Weka jina la aliyesaini','err');
  const p=finProject(pid);
  let fileUrl='';
  const f=document.getElementById('ctManualFile')?document.getElementById('ctManualFile').files[0]:null;
  if(f){ fileUrl=(typeof fbEnabled!=='undefined'&&fbEnabled)?await uploadToStorage(f,'contracts'):null; if(!fileUrl) fileUrl=await fileToDataURL(f); }
  p.contractSigned=true; p.contractSignatureType='manual'; p.contractSignedByName=name; p.contractSignedBy=me.id;
  p.contractSignedAt=(document.getElementById('ctManualDate').value?new Date(document.getElementById('ctManualDate').value).toISOString():new Date().toISOString());
  p.contractSignatureFile=fileUrl;
  finLogAudit(pid,'CONTRACT',pid,'SIGNED_MANUAL',false,true);
  save(); toast('Mkataba umethibitishwa kama umesainiwa (mkono) ✓','ok'); financeHub(pid,'contract');
}
function finReopenContract(pid){
  if(!isStaff())return toast('Admin au Boss pekee anaweza kufungua mkataba tena.','err');
  const p=finProject(pid);
  p.contractSigned=false;
  finLogAudit(pid,'CONTRACT',pid,'REOPENED',true,false);
  save(); toast('Mkataba umefunguliwa tena kwa marekebisho.','ok'); financeHub(pid,'contract');
}
function finSaveContractDraft(pid){
  const p=finProject(pid);
  p.contractNumber=document.getElementById('ctNum').value.trim()||p.contractNumber;
  p.budget=Math.max(0,Number(document.getElementById('ctCV').value||0));
  p.plannedCost=Math.max(0,Number(document.getElementById('ctPC').value||0));
  p.vatPercent=Number(document.getElementById('ctVat').value||0);
  p.retentionPercent=Number(document.getElementById('ctRet').value||0);
  finLogAudit(pid,'PROJECT',pid,'CONTRACT_DRAFT_UPDATED',null,null);
  save(); toast('Taarifa za mkataba zimehifadhiwa. Sasa saini ili kufungua bajeti.','ok'); financeHub(pid,'contract');
}

/* ---------- Gate the Budget tab behind a signed contract ---------- */
const _finRenderBudgetOrig=finRenderBudget;
finRenderBudget=function(body,pid){
  const p=finProject(pid);
  if(!p.contractSigned){
    body.innerHTML='<div class="card"><h3>🔒 Bajeti Imefungwa</h3><p>Bajeti ya mradi haiwezi kupangwa mpaka <b>mkataba usainiwe</b> kwanza. Hii inahakikisha kiasi kilichopangwa kinaendana na mkataba rasmi.</p><button onclick="financeHub('+pid+',\'contract\')">NENDA KWENYE MKATABA</button></div>';
    return;
  }
  return _finRenderBudgetOrig(body,pid);
};

/* ---------- Project Gate: first screen after login ---------- */
function activeProjectId(){
  if(!me) return null;
  state.activeProject=state.activeProject||{};
  const pid=state.activeProject[me.id];
  if(pid && myProjects().some(function(p){return p.id===pid;})) return pid;
  return null;
}
function setActiveProject(pid){
  state.activeProject=state.activeProject||{};
  state.activeProject[me.id]=Number(pid);
  save();
}
function projectGatePage(){
  if(!me) return;
  document.querySelectorAll('.nav').forEach(function(n){n.classList.remove('active');});
  const ps=myProjects();
  let html='<div class="pg-wrap"><div class="pg-hero"><div class="pg-hero-inner"><span class="pill">Karibu, '+esc(me.name)+'</span><h1>Chagua Mradi Unaoendelea Kuufanyia Kazi</h1><p>Chagua mradi ulio chini ili uendelee na kazi yako, au tengeneza mradi mpya kuanza mkataba mpya.</p></div></div>';
  if(ps.length){
    const canCreate=isStaff();
    html+='<div class="pg-toolbar"><input id="pgSearch" placeholder="🔍 Tafuta mradi kwa jina..." oninput="pgFilter()">'+(canCreate?'<button onclick="projectForm()">+ TENGENEZA MRADI MPYA</button>':'')+'</div>';
    html+='<div class="pg-grid" id="pgGrid">'+ps.map(function(p){
      const client=p.clientName||'—';
      const signed=!!p.contractSigned;
      const status=p.status||'PLANNING';
      return '<div class="pg-card" data-name="'+esc(p.name).toLowerCase()+'" onclick="pgEnterProject('+p.id+')">'
        +'<div class="pg-card-top"><span class="pg-status pg-status-'+esc(status)+'">'+esc(status)+'</span>'+(signed?'<span class="pg-signed">✅ Mkataba Umesainiwa</span>':'<span class="pg-unsigned">⏳ Bado Kusainiwa</span>')+'</div>'
        +'<h3>'+esc(p.name)+'</h3><div class="small muted">Client: '+esc(client)+'</div>'
        +'<div class="progress" style="margin:10px 0"><div style="width:'+(p.progress||0)+'%"></div></div>'
        +'<div class="pg-card-foot"><span>'+(p.progress||0)+'% Kamili</span><span>'+money(p.budget)+'</span></div>'
        +'</div>';
    }).join('')+'</div>';
  } else {
    const canCreate=isStaff();
    html+='<div class="pg-empty"><div class="pg-empty-icon">🏗️</div><h2>Bado Huna Mradi</h2><p>Anza kwa kutengeneza mradi wako wa kwanza ili kuanza kusimamia ujenzi, mkataba, bajeti na fedha.</p>'
      +(canCreate?'<button onclick="projectForm()">+ TENGENEZA MRADI WA KWANZA</button>':'<p class="small muted">Muulize Admin akutengenezee mradi.</p>')
      +'</div>';
  }
  html+='</div>';
  app.innerHTML=html;
}
function pgFilter(){
  const el=document.getElementById('pgSearch'); if(!el) return;
  const q=(el.value||'').toLowerCase();
  document.querySelectorAll('#pgGrid .pg-card').forEach(function(card){
    card.style.display=(card.getAttribute('data-name')||'').indexOf(q)!==-1?'':'none';
  });
}
function pgEnterProject(pid){
  setActiveProject(pid);
  const btn=document.querySelector('.nav[data-key="Dashboard"]');
  go('Dashboard',btn);
}

/* Show the Project Gate right after boot (login or restored session) instead of

(function(){

      setTimeout(function(){
        if(document.getElementById('shell') && !document.getElementById('shell').classList.contains('hidden')) projectGatePage();

})();

/* Shared "letterhead" used by every generated document: navy header band with
   the company logo + name, a gold accent bar, and the document title picked
   out in gold on the right. Returns the Y position where body content
   should start. */
function pdfLetterhead(doc,title,subtitle){
  doc.setFillColor(0,39,86);
  doc.rect(0,0,210,36,'F');
  doc.setFillColor(255,176,0);
  doc.rect(0,36,210,2.2,'F');
  try{doc.addImage(COMPANY_LOGO_DATAURL,'PNG',14,7,22,22);}catch(e){}
  doc.setFont(undefined,'bold');
  doc.setFontSize(16);
  doc.setTextColor(255,255,255);
  doc.text(company.name,42,17);
  doc.setFont(undefined,'normal');
  doc.setFontSize(8.5);
  doc.setTextColor(205,220,242);
  doc.text(company.address+'  |  '+company.phone+'  |  '+company.email,42,24);
  doc.setFont(undefined,'bold');
  doc.setFontSize(19);
  doc.setTextColor(255,176,0);
  doc.text(title,196,18,{align:'right'});
  if(subtitle){
    doc.setFont(undefined,'normal');
    doc.setFontSize(9);
    doc.setTextColor(205,220,242);
    doc.text(subtitle,196,26,{align:'right'});
  }
  doc.setFont(undefined,'normal');
  doc.setTextColor(20,20,20);
  return 48;
}

/* Shared footer: thin gold-navy rule + small print, on every page. */
function pdfFooter(doc,note){
  doc.setDrawColor(226,232,240);
  doc.setLineWidth(.4);
  doc.line(14,283,196,283);
  doc.setFontSize(8);
  doc.setTextColor(140,148,160);
  doc.text(note||('Hati hii imetengenezwa kielektroniki na '+company.name+' • '+new Date().toLocaleString()),14,289);
  doc.setFontSize(8);
  doc.setTextColor(140,148,160);
  doc.text('Ukurasa 1',196,289,{align:'right'});
}

/* A rounded, navy-filled box used to make the headline figure of a document
   (total due, amount paid, forecast profit, etc.) stand out clearly. */
function pdfHighlightBox(doc,x,y,w,h,label,value,accent){
  doc.setFillColor(0,39,86);
  doc.roundedRect(x,y,w,h,3,3,'F');
  doc.setFont(undefined,'normal');
  doc.setFontSize(9);
  doc.setTextColor(190,206,232);
  doc.text(label,x+9,y+h/2-4);
  doc.setFont(undefined,'bold');
  doc.setFontSize(16);
  if(accent){doc.setTextColor(255,176,0);}else{doc.setTextColor(255,255,255);}
  doc.text(value,x+9,y+h/2+8);
  doc.setFont(undefined,'normal');
}

/* A clean two-column key/value block with light zebra striping, used for
   invoice/report line items. Returns the ending Y position. */
function pdfKVRows(doc,x,y,w,rows,rowH){
  rowH=rowH||8;
  rows.forEach(function(r,i){
    if(i%2===0){doc.setFillColor(247,249,252);doc.rect(x,y-5.5,w,rowH,'F');}
    doc.setFont(undefined,'normal');
    doc.setFontSize(10.5);
    doc.setTextColor(90,99,112);
    doc.text(String(r[0]),x+4,y);
    doc.setFont(undefined,'bold');
    doc.setTextColor(20,26,38);
    doc.text(String(r[1]),x+w-4,y,{align:'right'});
    y+=rowH;
  });
  return y;
}

/* A small coloured status pill drawn directly on the PDF page. */
function pdfStatusPill(doc,x,y,label,ok){
  doc.setFont(undefined,'bold');
  doc.setFontSize(9);
  const w=doc.getTextWidth(label)+10;
  if(ok){doc.setFillColor(220,252,231);doc.setTextColor(22,101,52);}
  else{doc.setFillColor(254,226,226);doc.setTextColor(153,27,27);}
  doc.roundedRect(x,y-5,w,7,3.5,3.5,'F');
  doc.text(label,x+5,y);
  doc.setFont(undefined,'normal');
  doc.setTextColor(20,20,20);
}

  const LANG=function(){try{return (typeof state!=='undefined'&&state&&state.lang==='en')?'en':'sw';}catch(_){return 'sw';}};

  let PROTECT=new Set(),protectAt=0;

  function buildProtect(){
    const now=Date.now();if(now-protectAt<400)return;protectAt=now;
    const P2=new Set(),add=function(v){if(typeof v==='string'){v=v.trim();if(v)P2.add(v);}};

  }
  function tr(t){
    const s=t.trim();if(!s)return null;
    if(PROTECT.has(s))return null;
    const en=LANG()==='en',DD=en?D_EN:D_SW,PP=en?P_EN:P;
    if(Object.prototype.hasOwnProperty.call(DD,s))return t.replace(s,DD[s]);
    for(let i=0;i<PP.length;i++){const r=PP[i];if(r[0].test(s))return t.replace(s,s.replace(r[0],r[1]));}

    const TT=en?(window.SE_TERMS_EN||[]):(window.SE_TERMS_SW||[]);let o=s;

    if(o!==s)return t.replace(s,o);

  }

  function trMsg(m){
    if(m==null)return m;m=String(m);const r=tr(m);if(r!==null)return r;
    if(m.indexOf('\n')!==-1)return m.split('\n').map(trStr).join('\n');

  function trAny(x){if(typeof x==='string')return trStr(x);if(Array.isArray(x))return x.map(trAny);return x;}
  function patchLibs(){
    const J=window.jspdf&&window.jspdf.jsPDF;
    if(J&&!J.__se){
      /* Kila hati mpya ya PDF inapata doc.text inayotafsiri lebo (data ya mtumiaji inalindwa na PROTECT). */
      const W=function(){

        if(Array.isArray(rows))rows=rows.map(function(r){if(!r||typeof r!=='object')return r;const o={};Object.keys(r).forEach(function(k){const v=r[k];o[trStr(k)]=(typeof v==='string'&&/^[A-Z_ ]+$|^[A-Z][a-z]/.test(v))?trStr(v):v;});return o;});
        return oj.call(this,rows,opts);};
      X.__se=true;
    }
  }
  window.sePatchLibs=patchLibs;
  /* <html translate="no"> inazuia Google Translate ya browser tu; ndani ya ukurasa, .notranslate inalinda data ya mtumiaji. */
  function blocked(el){const c=el&&el.closest('.notranslate,[translate="no"],script,style,textarea,.leaflet-attribution-flag');return !!c&&c!==document.documentElement;}
  function skip(el){return !el||blocked(el);}

    /* Linda thamani za dropdown: chaguo lisilo na value lingechukua maandishi yaliyotafsiriwa kama thamani yake
       (mf. hali ya mradi ingehifadhiwa 'INAENDELEA' badala ya code 'ACTIVE'). */
    root.querySelectorAll('option:not([value])').forEach(function(o){o.setAttribute('value',o.textContent);});
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const todo=[];
    while((n=w.nextNode())){if(skip(n.parentElement))continue;const r=tr(n.nodeValue);if(r!==null&&r!==n.nodeValue)todo.push([n,r]);}
    todo.forEach(function(x){x[0].nodeValue=x[1];});
    root.querySelectorAll('[placeholder],[title]').forEach(function(el){
      /* Maelekezo (placeholder/title) yanatafsiriwa hata kwenye textarea; maandishi ya mtumiaji ndani yake hayaguswi. */
      const c=el.closest('.notranslate,[translate="no"]');if(c&&c!==document.documentElement&&c!==el)return;
      ['placeholder','title'].forEach(function(a){const v=el.getAttribute(a);if(!v)return;const r=(LANG()==='sw'&&PH[v])||tr(v);if(r!==null&&r!==undefined&&r!==v)el.setAttribute(a,r);});
    });
  }
  const PH={'Eneo / Location':'Eneo la kazi','Jina la kazi / project':'Jina la kazi au mradi','Keywords/tags, mfano nyumba, sustainability, Mbeya':'Maneno muhimu, mf. nyumba, mazingira, Mbeya',

  window.seTranslatePage=run;

     +'</div></div></div>';
  };

  window.login=async function(){

  window.seRenderStageChart=function(pid){
    const p=state.projects.find(function(x){return x.id===Number(pid);});const el=document.getElementById('projectChart');
    if(!p||!el||typeof Chart==='undefined')return;
    const ms=p.milestones||[],sel=val('chartStage')||'ALL',info=document.getElementById('stageChartInfo'),actsBox=document.getElementById('stageChartActs');
    try{const old=Chart.getChart(el);if(old)old.destroy();}catch(e){}
    if(!ms.length||sel==='ALL'){
      if(info)info.innerHTML='<b>Mradi mzima:</b> '+(p.progress||0)+'% • hatua '+ms.filter(function(m){return (m.progress||0)>=100;}).length+' kati ya '+ms.length+' zimekamilika';
      if(actsBox)actsBox.innerHTML='';
      const labels=ms.length?ms.map(function(m){return m.name;}):['Imekamilika','Imebaki'];
      const data=ms.length?ms.map(function(m){return Number(m.progress||0);}):[Number(p.progress||0),100-Number(p.progress||0)];
      const colors=ms.length?ms.map(function(m){return (m.progress||0)>=100?'#16a34a':((m.progress||0)>0?'#ffb000':'#94a3b8');}):['#ffb000','#002756'];
      try{new Chart(el,{type:'bar',data:{labels:labels,datasets:[{label:'Asilimia %',data:data,backgroundColor:colors}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,max:100,ticks:{callback:function(v){return v+'%';}}},x:{ticks:{autoSkip:false,maxRotation:40}}},plugins:{legend:{display:false}}}});}catch(e){console.warn(e);}
      return;
    }
    const m=ms.find(function(x){return String(x.id)===String(sel);});if(!m)return;
    const acts=seStageActivities(p.id,m.id);
    if(info)info.innerHTML='<b>'+esc(m.name)+':</b> '+(m.progress||0)+'% • '+seStageLabel(m)+(m.date?' • 📅 imepangwa '+esc(m.date):'')+' • shughuli '+acts.length;
    if(acts.length>=2){
      try{new Chart(el,{type:'line',data:{labels:acts.map(function(a){return a.date||'';}),datasets:[{label:m.name+' (%)',data:acts.map(function(a){return Number(a.percent||0);}),borderColor:'#ffb000',backgroundColor:'rgba(255,176,0,.18)',fill:true,tension:.25,pointRadius:5}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,max:100,ticks:{callback:function(v){return v+'%';}}}},plugins:{legend:{display:false}}}});}catch(e){console.warn(e);}
    }else{
      try{new Chart(el,{type:'doughnut',data:{labels:['Imekamilika','Imebaki'],datasets:[{data:[Number(m.progress||0),100-Number(m.progress||0)],backgroundColor:['#ffb000','#e2e8f0']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});}catch(e){console.warn(e);}
    }
    if(actsBox)actsBox.innerHTML=acts.length?'<div class="small muted" style="margin-top:8px">'+acts.slice(-3).reverse().map(function(a){return '• '+esc(a.date||'')+' — '+esc(a.title)+' ('+(a.percent||0)+'%)';}).join('<br>')+'</div>':'<p class="small muted" style="margin-top:8px">Bado hakuna kazi iliyorekodiwa kwa hatua hii.</p>';

  /* =================== ACTIVITIES = CHANZO PEKEE CHA PROGRESS ===================
     Kila "Kazi Iliyofanyika" inaunganishwa na hatua moja ya mradi. Asilimia ya
     hatua = asilimia ya kazi ya mwisho iliyorekodiwa kwa hatua hiyo; progress ya
     mradi = wastani wa hatua zote. Hakuna tena kuingiza progress sehemu mbili. */
  const ACT_KINDS={DAILY:'✅ Kazi Iliyofanyika',WEEKLY:'🗓️ Mpango wa Wiki',MONTHLY:'📆 Mpango wa Mwezi',BASELINE:'📌 Hali ya Awali'};
  function actOrder(a){return String(a.date||'')+'|'+String(a.createdAt||'');}
  function seStageActivities(pid,sid){
    return (state.activities||[]).filter(function(a){return a.project===Number(pid)&&a.stage!=null&&String(a.stage)===String(sid)&&(a.kind==='DAILY'||a.kind==='BASELINE');})
      .sort(function(a,b){return actOrder(a).localeCompare(actOrder(b));});
  }
  window.seStageActivities=seStageActivities;
  window.seRecalcProgress=function(pid){
    const p=state.projects.find(function(x){return x.id===Number(pid);});if(!p||!(p.milestones||[]).length)return false;
    const before=p.progress;
    p.milestones.forEach(function(m){
      const acts=seStageActivities(p.id,m.id),last=acts[acts.length-1];
      m.progress=last?Math.max(0,Math.min(100,Number(last.percent||0))):0;
      m.status=m.progress>=100?'DONE':(m.progress>0?'ACTIVE':'PENDING');
    });
    p.progress=Math.round(p.milestones.reduce(function(s,x){return s+Number(x.progress||0);},0)/p.milestones.length);
    if(p.progress>=100)p.status='COMPLETED';
    else if(p.status==='COMPLETED'||(p.progress>0&&p.status==='PLANNING'))p.status='ACTIVE';
    return before!==p.progress;
  };
  /* Mara moja: hifadhi asilimia za zamani kama "hali ya awali" ili zisipotee. */
  function migrateStageBaselines(){
    if(state._activitiesLinked)return false;
    state.activities=state.activities||[];
    const now=new Date().toISOString(),today=todayISO();
    (state.projects||[]).forEach(function(p){
      const ms=p.milestones||[];if(!ms.length)return;
      let total=ms.reduce(function(s,m){return s+Number(m.progress||0);},0);
      if(total===0&&Number(p.progress||0)>0){
        /* progress iliwekwa kwa mkono bila hatua: gawanya kwa hatua kwa mpangilio */
        let left=Math.round(Number(p.progress)*ms.length);
        ms.forEach(function(m){const v=Math.min(100,left);m.progress=v;left-=v;});
      }
      ms.forEach(function(m){
        if(Number(m.progress||0)>0&&!seStageActivities(p.id,m.id).length){
          state.activities.push({id:id(),project:p.id,kind:'BASELINE',stage:m.id,title:'Hali ya awali — '+m.name,date:m.date||today,percent:Number(m.progress),notes:'Imetengenezwa automatic kutoka progress ya zamani.',createdAt:now});
        }
      });
      seRecalcProgress(p.id);
    });
    state._activitiesLinked=true;
    return true;
  }

  window.createActivity=async function(pid){
    if(!isStaff())return toast('Huna ruhusa.','err');
    const p=state.projects.find(function(x){return x.id===Number(pid);});if(!p)return;
    const kind=val('actKind')||'DAILY',sid=val('actStage'),m=(p.milestones||[]).find(function(x){return String(x.id)===sid;});
    const pctRaw=val('actPercent');
    if(kind==='DAILY'&&(p.milestones||[]).length&&!m)return toast('Chagua hatua ya mradi.','err');
    if(pctRaw===''||isNaN(Number(pctRaw))||Number(pctRaw)<0||Number(pctRaw)>100)return toast('Asilimia iwe kati ya 0 na 100.','err');
    const pct=Number(pctRaw);
    let title=val('actTitle');
    if(!title){if(kind==='DAILY'&&m)title='Kazi — '+m.name;else return toast('Weka kichwa cha shughuli.','err');}
    if(kind==='DAILY'&&m&&pct<Number(m.progress||0)&&!confirm('Asilimia hii ('+pct+'%) ni ndogo kuliko ya sasa ('+(m.progress||0)+'%). Una uhakika unataka kupunguza progress ya "'+m.name+'"?'))return;

    const before=p.progress;
    state.activities.push({id:id(),project:p.id,kind:kind,stage:m?m.id:null,title:title,date:val('actDate')||todayISO(),percent:pct,notes:val('actNotes'),docName:docName,docData:docData,by:me.id,createdAt:new Date().toISOString()});
    seRecalcProgress(p.id);
    logHistory('ACTIVITY_ADDED',title+(m?' ['+m.name+' '+pct+'%]':''),p.id);
    if(p.progress!==before)notifyProject(p,'Progress ya mradi: '+before+'% → '+p.progress+'%');
    save();toast(kind==='DAILY'&&m?'Imehifadhiwa ✓ — mradi sasa uko '+p.progress+'%':'Imehifadhiwa ✓','ok');

  async function readExpForm(prev){

    if((qty!==null&&!(qty>0))||(unitCost!==null&&unitCost<0)){toast('Kiasi au bei si sahihi.','err');return null;}
    if(!(amount>0)){toast('Jumla lazima iwe zaidi ya sifuri.','err');return null;}

  function migrateMaterialsToLedger(){
    if(state._materialsMerged)return false;
    state.finExpenses=state.finExpenses||[];
    (state.materials||[]).forEach(function(m){
      if(m.mergedToLedger)return;
      const isMat=m.category==='HARDWARE'||m.category==='EARTH';
      state.finExpenses.push({id:id(),code:finNextExpenseId(),project:m.project,category:isMat?'Materials':'Other Expenses',matType:isMat?m.category:null,
        description:m.name,qty:Number(m.qty)||null,unit:m.unit||'',unitCost:Number(m.unitCost)||0,amount:Number(m.totalCost||0),date:m.date||'',vendor:'',invoiceRef:'',paymentMethod:'Taslimu',status:'PAID',
        paidBy:'',notes:'Imehamishwa kutoka daftari la zamani la vifaa',createdBy:m.by||null,createdAt:m.createdAt||new Date().toISOString(),approvedBy:m.by||null});
      m.mergedToLedger=true;
    });
    (state.miscExpenses||[]).forEach(function(m){
      if(m.mergedToLedger)return;
      state.finExpenses.push({id:id(),code:finNextExpenseId(),project:m.project,category:'Site Operations',matType:null,description:m.description,qty:null,unit:'',unitCost:null,amount:Number(m.amount||0),
        date:m.date||'',vendor:'',invoiceRef:'',paymentMethod:'Taslimu',status:'PAID',paidBy:'',notes:'Imehamishwa kutoka matumizi mengine ya zamani',createdBy:null,createdAt:new Date().toISOString(),approvedBy:null});
      m.mergedToLedger=true;
    });
    state._materialsMerged=true;
    return true;
  }


  /* Audit Trail inayosomeka: badala ya data ghafi ({"status":"PAID"}) inaonyesha maneno. */
  function audVal(v){
    if(v===null||v===undefined||v==='')return '—';
    const lbl={status:'Hali',amount:'Kiasi',category:'Kategoria',description:'Maelezo',budget:'Thamani ya mkataba',plannedCost:'Gharama iliyopangwa',vatPercent:'VAT %',retentionPercent:'Kinachozuiliwa %',costToComplete:'Gharama ya kukamilisha',planned:'Iliyopangwa'};
    const one=function(k,x){if(typeof x==='number')return (/amount|budget|cost|planned/i.test(k)?moneyTZS(x):String(x));if(typeof x==='string')return (window.seStatusSw?seStatusSw(x):x);if(typeof x==='boolean')return seTr(x?'Ndiyo':'Hapana');return '';};
    if(Array.isArray(v))return v.filter(function(r){return r&&Number(r.planned)>0;}).map(function(r){return finCatLabel(r.category)+': '+moneyTZS(r.planned);}).join('; ')||'—';
    if(typeof v==='object')return Object.keys(v).map(function(k){return seTr(lbl[k]||k)+': '+(k==='category'?finCatLabel(v[k]):one(k,v[k]));}).join(' • ');
    return one('amount',v);
  }
  const AUD_ACT={CREATED:'Imeundwa',EDITED:'Imehaririwa',DELETED:'Imefutwa',APPROVED:'Imeidhinishwa',REJECTED:'Imekataliwa',PAID:'Imelipwa',ISSUED:'Imetolewa',CANCELLED:'Imeghairiwa',RECORDED:'Imerekodiwa',UPDATED:'Imesasishwa',
    FINANCIAL_SETUP_UPDATED:'Mipangilio ya fedha imesasishwa',FINANCIAL_CLOSED:'Rekodi za fedha zimefungwa',FINANCIAL_REOPENED:'Rekodi za fedha zimefunguliwa',CONTRACT_DRAFT_UPDATED:'Taarifa za mkataba zimesasishwa',
    SIGNED_DIGITAL:'Umesainiwa kidijitali',SIGNED_MANUAL:'Umethibitishwa kusainiwa kwa mkono',REOPENED:'Umefunguliwa tena'};
  const AUD_ENT={EXPENSE:'Matumizi',INVOICE:'Ankara',PAYMENT:'Malipo',CHANGE_ORDER:'Badiliko la kazi',PROJECT:'Mradi',BUDGET:'Bajeti',CONTRACT:'Mkataba'};
  window.finRenderAudit=function(body,pid){
    if(!isStaff()){body.innerHTML='<div class="card empty">Huna ruhusa ya kuona kumbukumbu hizi.</div>';return;}
    const list=(state.finAudit||[]).filter(function(x){return x.project===pid;});
    const code=function(x){const src={EXPENSE:state.finExpenses,INVOICE:state.finInvoices,CHANGE_ORDER:state.finChangeOrders}[x.entity];const r=src&&src.find(function(e){return e.id===x.entityId;});return r?(r.code||r.number||''):'';};
    body.innerHTML='<div class="card"><h3>🕓 Kumbukumbu za Mabadiliko ya Fedha</h3><div style="overflow-x:auto"><table><tr><th>Tarehe</th><th>Kipengele</th><th>Kitendo</th><th>Aliyefanya</th><th>Kabla</th><th>Baada</th></tr>'
      +(list.map(function(x){return '<tr><td class="small">'+new Date(x.at).toLocaleString()+'</td><td>'+esc(seLang()==='en'?String(x.entity).replace(/_/g,' '):(AUD_ENT[x.entity]||x.entity))+(code(x)?' <span class="small muted">'+esc(code(x))+'</span>':'')+'</td><td>'+esc(seLang()==='en'?String(x.action).replace(/_/g,' ').toLowerCase().replace(/^./,function(c){return c.toUpperCase();}):(AUD_ACT[x.action]||x.action))+'</td><td>'+esc(x.byName||'')+'</td><td class="small">'+esc(audVal(x.prev))+'</td><td class="small">'+esc(audVal(x.next))+'</td></tr>';}).join('')||'<tr><td colspan="6" class="empty">Hakuna kumbukumbu bado.</td></tr>')
      +'</table></div></div>';
  };
  /* =================== KUKUMBUKA UKURASA ULIOPO ===================
     Kurasa hizi mara nyingi hufunguliwa moja kwa moja (mf. kutoka ndani ya
     mradi). Tunakumbuka zilipo ili kubadili lugha/currency au cloud sync
     kusimrudishe mtumiaji kwenye ukurasa mwingine. */
  [['financeHub','Financial Management'],['laborPage','Labor & Engineers'],['activitiesPage','Activities']].forEach(function(pair){
    const orig=window[pair[0]];if(typeof orig!=='function')return;
    window[pair[0]]=function(pid){
      const r=orig.apply(this,arguments);
      const shown=Number(pid)||Number(val({financeHub:'finProjSel',laborPage:'labProj',activitiesPage:'actProj',materialsPage:'matProj'}[pair[0]]))||null;
      currentView={fn:pair[1],arg:shown};
      return r;
    };
  });
  window.renderCurrentView=function(){
    if(!me)return;
    if(!currentView)return projectGatePage();
    const f=currentView.fn,a=currentView.arg;
    if(f==='ProjectDetail'&&state.projects.some(function(p){return p.id===a;}))return project(a);
    if(f==='Financial Management')return financeHub(a||activePid(),window._finTab||'dashboard');
    if(f==='Labor & Engineers')return laborPage(a||activePid());
    if(f==='Activities')return activitiesPage(a||activePid());
    if(f==='ChangePassword')return changePasswordPage();
    if(ROUTES[f]&&canModule(f)){try{ROUTES[f]();}catch(err){console.error(err);}return;}
    projectGatePage();
  };


  /* =================== KUANZISHA MFUMO (HAKUNA DEMO ACCOUNTS) ===================
     Mfumo hauna tena akaunti za majaribio. Mara ya kwanza (au kama Admin pekee
     aliyepo ni wa demo), mmiliki anaunda akaunti yake halisi ya Admin hapa. */
  const DEMO_CREDS={admin:['Admin123!'],boss:['Boss123!'],manager:['Manager123!'],client:['Client123!'],engineer:['Engineer123!']};
  async function isDemoAccount(u){
    const pw=DEMO_CREDS[String(u.username||'').toLowerCase()];if(!pw)return false;
    for(const x of pw){try{if(await verifyPassword(x,u.password))return true;}catch(_){}}
    return false;
  }
  async function seHasRealAdmin(){
    for(const u of (state.users||[])){if(u.role==='ADMIN'&&isActiveUser(u)&&!(await isDemoAccount(u)))return true;}
    return false;
  }
  window.seHasRealAdmin=seHasRealAdmin;
  /* Futa demo accounts zote ambazo bado zina nenosiri la demo. Rekodi zao zinabaki. */
  async function purgeDemoAccounts(keepId){
    const real=(state.users||[]).find(function(u){return u.role==='ADMIN'&&isActiveUser(u)&&u.id!==keepId;})||(state.users||[]).find(function(u){return u.id===keepId;});
    const gone=[];
    for(const u of (state.users||[]).slice()){if(u.id!==keepId&&await isDemoAccount(u))gone.push(u.id);}
    if(!gone.length)return false;
    state.users=state.users.filter(function(u){return gone.indexOf(u.id)===-1;});
    (state.projects||[]).forEach(function(p){if(gone.indexOf(p.manager)!==-1)p.manager=real?real.id:null;});
    if(state.accountModules)gone.forEach(function(i){delete state.accountModules[i];});
    return true;
  }
  window.setupPage=function(){
    const box=document.getElementById('auth');box.classList.remove('hidden');
    const sh=document.getElementById('shell');if(sh)sh.classList.add('hidden');
    box.innerHTML='<div class="lm-wrap"><div class="lm-brand">'+'<div class="lm-lang"><select id="loginLangSel" aria-label="Lugha / Language" onchange="setLang(this.value)"><option value="sw" '+(seLang()==='sw'?'selected':'')+'>🇹🇿 Kiswahili</option><option value="en" '+(seLang()==='en'?'selected':'')+'>🇬🇧 English</option></select></div>'+'<div class="lm-brand-inner"><div class="lm-logo">🏗️</div><h1>Smart Empire<br>Platform System</h1>'
     +'<p>Karibu! Hii ni mara ya kwanza kuanzisha mfumo kwenye kifaa hiki.</p><ul class="lm-features"><li>✓ Unda akaunti yako ya Msimamizi Mkuu (Admin)</li><li>✓ Kisha ongeza akaunti za Boss ndani ya mfumo</li><li>✓ Hakuna akaunti za majaribio (demo)</li></ul></div></div>'
     +'<div class="lm-formside"><div class="card lm-card"><h2>Anzisha Mfumo</h2><p class="muted">Unda akaunti ya Admin</p>'
     +'<input id="suName" placeholder="Jina kamili *" autocomplete="name">'
     +'<input id="suUser" placeholder="Jina la mtumiaji *" autocomplete="username">'
     +'<input id="suEmail" type="email" placeholder="Barua pepe (hiari)" autocomplete="email">'
     +'<input id="suPhone" type="tel" placeholder="Simu (hiari)" autocomplete="tel">'
     +'<input id="suPw" type="password" placeholder="Nenosiri * (herufi 8+, herufi na namba)" autocomplete="new-password">'
     +'<input id="suPw2" type="password" placeholder="Rudia nenosiri *" autocomplete="new-password" onkeydown="if(event.key===\'Enter\')seCompleteSetup()">'
     +'<button id="suBtn" style="width:100%" onclick="seCompleteSetup()">UNDA AKAUNTI NA INGIA</button>'
     +'<div id="suErr" class="notice hidden"></div>'
     +'<p class="small muted" style="margin-top:12px;text-align:center">Hifadhi nenosiri hili mahali salama — ndilo la kuingia kama Admin.</p></div></div></div>';
  };
  window.seCompleteSetup=async function(){
    const err=document.getElementById('suErr');const fail=function(m){err.classList.remove('hidden');err.textContent=m;};
    if(await seHasRealAdmin())return auth();
    const name=val('suName'),username=val('suUser'),email=val('suEmail'),phone=val('suPhone');
    const pw=(document.getElementById('suPw')||{}).value||'',pw2=(document.getElementById('suPw2')||{}).value||'';
    if(!name||!username||!pw)return fail('Jaza jina kamili, jina la mtumiaji na nenosiri.');
    if(!/^[A-Za-z0-9._-]{3,}$/.test(username))return fail('Jina la mtumiaji liwe na herufi 3 au zaidi (herufi, namba, . _ -) bila nafasi.');
    if(pw.length<8||!/[A-Za-z]/.test(pw)||!/[0-9]/.test(pw))return fail('Nenosiri liwe na angalau herufi 8, likiwa na herufi na namba.');
    if(pw!==pw2)return fail('Manenosiri hayafanani.');
    if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return fail('Barua pepe si sahihi.');
    normalizeRoles();
    /* Kama kuna Admin wa demo, tunachukua nafasi yake (id ile ile) ili rekodi alizoweka zibaki na jina sahihi. */
    let adm=null;
    for(const u of state.users){if(u.role==='ADMIN'&&await isDemoAccount(u)){adm=u;break;}}
    const clash=state.users.find(function(u){return String(u.username).toLowerCase()===username.toLowerCase()&&u!==adm;});
    if(clash&&!(await isDemoAccount(clash)))return fail('Jina hilo la mtumiaji tayari linatumika.');
    const hashed=await hashPassword(pw);
    if(adm)Object.assign(adm,{name:name,username:username,email:email,phone:phone,password:hashed,status:'ACTIVE',role:'ADMIN'});
    else{adm={id:id(),name:name,username:username,email:email,phone:phone,password:hashed,role:'ADMIN',status:'ACTIVE',modules:MODULES.slice(),createdAt:new Date().toISOString()};state.users.push(adm);}
    await purgeDemoAccounts(adm.id);
    (state.projects||[]).forEach(function(p){if(!state.users.some(function(u){return u.id===p.manager;}))p.manager=adm.id;});
    adm.lastLogin=new Date().toISOString();
    me=adm;try{localStorage.setItem('jm_session',adm.id);}catch(_){}
    try{audit('SYSTEM_SETUP','Admin wa kwanza ameundwa: '+username);}catch(_){}
    logHistory('SYSTEM_SETUP','Mfumo umeanzishwa na '+name);save();
    toast('Karibu, '+name+'! Mfumo uko tayari.','ok');boot();
  };

  /* Taarifa (Updates) na Arifa (Notifications) zimeondolewa: hakuna tena arifa zinazohifadhiwa bila mahali pa kuzisoma. */
  window.notifyUsers=function(){};
  function clearNotifications(){if(state._notificationsRemoved)return false;state.notifications=[];state._notificationsRemoved=true;return true;}

  /* =================== START =================== */
  let dirty=normalizeRoles();
  if(migrateLegacyInvoices())dirty=true;
  if(migrateStageBaselines())dirty=true;
  if(migrateMaterialsToLedger())dirty=true;
  if(clearNotifications())dirty=true;
  if(dirty)save();
  (async function start(){
    const sid=localStorage.getItem('jm_session'),restore=!!(sessionStorage.getItem('jm_active_tab')&&sid);
    sessionStorage.setItem('jm_active_tab','1');
    let hasAdmin=false;try{hasAdmin=await seHasRealAdmin();}catch(_){}
    if(!hasAdmin){me=null;try{localStorage.removeItem('jm_session');}catch(_){}return setupPage();}
    if(await purgeDemoAccounts(null))save();
    if(restore){
      me=(state.users||[]).find(function(u){return String(u.id)===String(sid);})||null;
      if(me&&isStaff()&&isActiveUser(me))return boot();
    }
    try{localStorage.removeItem('jm_session');}catch(_){}
    me=null;auth();
  })();
})();

</script>

<script>
/* ============================================================
   SMART EMPIRE v7 — ANKARA (INVOICES) & MALIPO
   Mzunguko ulio wazi:  1 Andaa (rasimu) → 2 Toa kwa mteja → 3 Pokea malipo → 4 Imelipwa
   * Vipengele vingi (maelezo × idadi × bei), punguzo, VAT, kiasi kinachozuiliwa
   * Picha ya ankara inabadilika papo hapo unapojaza
   * Ukurasa wa kila ankara: hali, salio, malipo, historia, PDF, WhatsApp, barua pepe
   Data inabaki kwenye state.finInvoices / state.finPayments (inaendana na ya zamani).
   ============================================================ */
(function(){
  const $=function(i){return document.getElementById(i);};
  const v=function(i){const e=$(i);return e?String(e.value||'').trim():'';};
  const num=function(x){const n=Number(x);return isFinite(n)?n:0;};
  const r2=function(n){return Math.round(num(n)*100)/100;};
  const today=function(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);};
  const addDays=function(iso,n){const d=new Date((iso||today())+'T12:00:00');d.setDate(d.getDate()+Number(n||0));return d.toISOString().slice(0,10);};
  const fmtD=function(iso){if(!iso)return '—';const d=new Date(String(iso).length===10?iso+'T12:00:00':iso);return isNaN(d)?iso:d.toLocaleDateString(seLocale(),{day:'2-digit',month:'short',year:'numeric'});};
  const fmtDT=function(iso){if(!iso)return '';const d=new Date(iso);return isNaN(d)?'':d.toLocaleString(seLocale(),{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});};
  const findInv=function(id){return (state.finInvoices||[]).find(function(i){return i.id===Number(id);});};
  const closed=function(pid){const p=finProject(pid);if(p&&p.financialClosed){toast(bi('Rekodi za fedha za mradi huu zimefungwa. Zifungue kwanza kwenye Dashibodi ya fedha.','This project\'s financial records are closed. Reopen them from the finance dashboard first.'),'err');return true;}return false;};

  /* ---------- Hesabu ---------- */
  function invItems(x){
    if(Array.isArray(x.items)&&x.items.length)return x.items;
    return [{desc:x.description||bi('Kazi za mkataba','Contract works'),qty:1,unit:'',rate:num(x.amountBeforeTax)}];
  }
  function calc(items,discount,vatPct,retPct){
    const subtotal=r2(items.reduce(function(s,it){return s+num(it.qty)*num(it.rate);},0));
    const disc=r2(Math.min(Math.max(num(discount),0),subtotal));
    const taxable=r2(subtotal-disc);
    const vat=r2(taxable*num(vatPct)/100),ret=r2(taxable*num(retPct)/100);
    return {subtotal:subtotal,discount:disc,taxable:taxable,vat:vat,retention:ret,total:r2(taxable+vat-ret)};
  }
  window.seInvCalc=calc;
  function nextNumber(){
    const y=new Date().getFullYear();let max=0;
    (state.finInvoices||[]).forEach(function(i){const m=String(i.number||'').match(/^INV-(\d{4})-(\d+)$/);if(m&&Number(m[1])===y)max=Math.max(max,Number(m[2]));});
    let n='INV-'+y+'-'+String(max+1).padStart(4,'0');
    while((state.finInvoices||[]).some(function(i){return i.number===n;})){max++;n='INV-'+y+'-'+String(max+1).padStart(4,'0');}
    return n;

    const base={number:d.number,project:pid,clientName:d.clientName,clientPhone:d.clientPhone,clientEmail:d.clientEmail,clientAddress:d.clientAddress,date:d.date,dueDate:d.dueDate,terms:d.terms,
      description:d.description,reference:d.reference,items:items.map(function(it){return {desc:it.desc,qty:num(it.qty),unit:it.unit,rate:num(it.rate)};}),discount:t.discount,subtotal:t.subtotal,
      amountBeforeTax:t.taxable,vatPercent:d.vatPercent,retentionPercent:d.retentionPercent,vat:t.vat,retention:t.retention,total:t.total,notes:d.notes};
    let rec;

    else{rec=Object.assign({id:id(),state:'DRAFT',createdBy:me.id,createdAt:now},base);state.finInvoices=state.finInvoices||[];state.finInvoices.push(rec);finLogAudit(pid,'INVOICE',rec.id,'CREATED',null,'DRAFT');logHistory('INVOICE_CREATED',rec.number+' — '+moneyTZS(rec.total),pid);}

  function doIssue(x,fromSave){
    x.state='ISSUED';x.issuedAt=new Date().toISOString();x.issuedBy=me.id;
    if(!x.dueDate)x.dueDate=addDays(x.date,30);
    finLogAudit(x.project,'INVOICE',x.id,'ISSUED','DRAFT','ISSUED');finSnapshot(x.project);
    logHistory('INVOICE_ISSUED',x.number+' — '+moneyTZS(x.total),x.project);
    save();
    window._invFlash={kind:'ok',icon:'📤',title:bi('Ankara '+x.number+' imetolewa kwa mteja','Invoice '+x.number+' issued to the client'),
      text:bi('Sasa inahesabiwa kwenye “Bado kulipwa”. Mtumie mteja PDF au ujumbe wa WhatsApp, kisha rekodi malipo yanapoingia.','It now counts towards “Outstanding”. Send the client the PDF or a WhatsApp message, then record payments as they arrive.'),
      actions:'<button class="alt" onclick="finInvoicePDF('+x.id+')">📄 PDF</button>'+(x.clientPhone?'<button class="alt" onclick="seInvWhatsApp('+x.id+')">💬 WhatsApp</button>':'')};

  function recordPayment(x,amt,date,method,ref,notes){
    const bal=balOf(x);
    if(!(amt>0))return toast(bi('Weka kiasi sahihi cha malipo.','Enter a valid payment amount.'),'err'),null;
    if(amt>bal+0.5)return toast(bi('Kiasi hakiwezi kuzidi salio la '+money(bal)+'.','The amount cannot exceed the balance of '+money(bal)+'.'),'err'),null;
    if(!date)return toast(bi('Chagua tarehe ya malipo.','Choose the payment date.'),'err'),null;
    if(date>today())return toast(bi('Tarehe ya malipo haiwezi kuwa ya baadaye.','The payment date cannot be in the future.'),'err'),null;
    const rec={id:id(),invoice:x.id,project:x.project,date:date,amount:r2(amt),method:method,reference:ref,notes:notes,recordedBy:me.id,recordedAt:new Date().toISOString()};
    state.finPayments=state.finPayments||[];state.finPayments.push(rec);
    finLogAudit(x.project,'PAYMENT',rec.id,'RECORDED',null,rec.amount);finSnapshot(x.project);
    logHistory('PAYMENT_RECORDED',x.number+' — '+moneyTZS(rec.amount),x.project);
    save();
    const nb=balOf(x);
    window._invFlash=nb<=0.5
      ?{kind:'ok',icon:'🎉',title:bi('Ankara '+x.number+' imelipwa kikamilifu!','Invoice '+x.number+' is fully paid!'),text:bi('Malipo ya '+money(rec.amount)+' yamerekodiwa.','Payment of '+money(rec.amount)+' recorded.'),actions:'<button class="alt" onclick="finReceiptPDF('+rec.id+')">📄 '+bi('Pakua risiti','Download receipt')+'</button>'}
      :{kind:'ok',icon:'💵',title:bi('Malipo ya '+money(rec.amount)+' yamerekodiwa','Payment of '+money(rec.amount)+' recorded'),text:bi('Salio lililobaki: '+money(nb)+'.','Remaining balance: '+money(nb)+'.'),actions:'<button class="alt" onclick="finReceiptPDF('+rec.id+')">📄 '+bi('Pakua risiti','Download receipt')+'</button>'};
    toast(bi('Malipo yamehifadhiwa ✓','Payment saved ✓'),'ok');
    return rec;
  }

  async function fetchJSON(url,ms){

    }
    if(!p.location){
      const s=$('mapStatus');if(s)s.innerHTML='ℹ️ '+bi('Mradi huu hauna eneo. Tafuta mahali juu ya ramani, bonyeza “Eneo langu”, au bonyeza ramani kuweka site.','This project has no location. Search above the map, press “My location”, or tap the map to set the site.');
      const n=$('wxNow');if(n)n.innerHTML='<div class="wx-skel">📍 '+bi('Weka eneo la site ili kuona hali ya hewa yake.','Set the site location to see its weather.')+'</div>';
      return;
    }
    const s=$('mapStatus');if(s)s.textContent='⏳ '+bi('Inatafuta “'+p.location+'” kwenye ramani…','Finding “'+p.location+'” on the map…');
    const r=await geocode(p.location);
    if(W.pid!==p.id)return;
    if(!r.length){if(s)s.innerHTML='⚠️ '+bi('Eneo “'+esc(p.location)+'” halikupatikana. Tafuta jina lingine au bonyeza ramani kuweka site.','“'+esc(p.location)+'” was not found. Search another name or tap the map to set the site.');const n=$('wxNow');if(n)n.innerHTML='<div class="wx-skel">—</div>';return;}
    const g=r[0];
    p.lat=String(round(g.lat,6));p.lng=String(round(g.lng,6));p.geoLabel=g.full||g.name;p.geoSource='auto';save();
    setPin(g.lat,g.lng,false,g.full||g.name);
    if(W.map)W.map.setView([g.lat,g.lng],15);
    if(s)s.innerHTML='ℹ️ '+bi('Eneo limekadiriwa kutoka jina la mradi. Kwa usahihi wa site, buruta alama 🏗️ hadi eneo halisi kisha bonyeza Hifadhi.','Location estimated from the project name. For site accuracy, drag the 🏗️ pin to the exact spot and press Save.');
    loadWeather(g.lat,g.lng,false);
  }

  /* ---------- Vitendo vya ramani ---------- */
  window.seWxSearchSoon=function(){clearTimeout(W.searchT);const q=($('wxSearch')||{}).value||'';if(q.trim().length<3){seWxHideResults();return;}W.searchT=setTimeout(seWxSearch,550);};
  window.seWxHideResults=function(){const r=$('wxResults');if(r){r.classList.add('hidden');r.innerHTML='';}};
  window.seWxSearch=async function(){
    const q=(($('wxSearch')||{}).value||'').trim();const box=$('wxResults');if(!box||q.length<2)return;
    box.classList.remove('hidden');box.innerHTML='<button disabled>⏳ '+bi('Inatafuta…','Searching…')+'</button>';
    const my=++W.reqId;const r=await geocode(q);if(my!==W.reqId)return;
    W.results=r;
    box.innerHTML=r.length?r.map(function(x,i){return '<button role="option" onclick="seWxPick('+i+')"><b>'+esc(x.name)+'</b><small>'+esc(x.full||'')+'</small></button>';}).join('')
      :'<button disabled>'+bi('Hakuna matokeo. Jaribu jina la mji, kata au mtaa.','No results. Try a town, ward or street name.')+'</button>';
  };
  window.seWxPick=function(i){
    const x=(W.results||[])[i];if(!x)return;seWxHideResults();
    const inp=$('wxSearch');if(inp)inp.value=x.name;
    if(W.map)W.map.flyTo([x.lat,x.lng],16,{duration:1});
    setPin(x.lat,x.lng,true,x.full||x.name);
  };
  window.seWxLocateMe=function(){
    if(!navigator.geolocation)return toast(bi('Kifaa hiki hakina GPS/eneo.','This device has no location service.'),'err');
    const s=$('mapStatus');if(s)s.textContent='⏳ '+bi('Inapata eneo lako…','Getting your location…');
    navigator.geolocation.getCurrentPosition(function(pos){
      if(W.map)W.map.flyTo([pos.coords.latitude,pos.coords.longitude],18,{duration:1});
      setPin(pos.coords.latitude,pos.coords.longitude,true);
      toast(bi('Eneo lako limepatikana (usahihi ±'+Math.round(pos.coords.accuracy)+' m).','Location found (accuracy ±'+Math.round(pos.coords.accuracy)+' m).'),'ok');
    },function(err){
      if(s)s.textContent='';
      toast(err&&err.code===1?bi('Ruhusa ya eneo imekataliwa. Iruhusu kwenye mipangilio ya kivinjari.','Location permission denied. Allow it in the browser settings.'):bi('Imeshindikana kupata eneo lako. Jaribu nje au washa GPS.','Could not get your location. Try outdoors or turn on GPS.'),'err');
    },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  };
  window.seWxSaveSite=function(){
    const p=finProject(W.pid);if(!p||W.lat==null)return;
    if(!isStaff())return toast(bi('Huna ruhusa.','You do not have permission.'),'err');
    p.lat=String(W.lat);p.lng=String(W.lng);p.geoLabel=W.label||p.geoLabel||'';p.geoSource='manual';p.geoSetAt=new Date().toISOString();
    if(!p.location&&W.label)p.location=W.label.split(',').slice(0,2).join(',').trim();
    logHistory('PROJECT_EDITED',p.name+' — '+bi('eneo la site: ','site location: ')+W.lat+', '+W.lng,p.id);save();
    W.dirty=false;const b=$('wxSaveBtn');if(b)b.disabled=true;
    const s=$('mapStatus');if(s)s.innerHTML='✅ '+bi('Eneo halisi la site limehifadhiwa. Hali ya hewa sasa inaonyesha eneo hili.','The exact site location is saved. The weather now shows this spot.');
    toast(bi('Eneo la site limehifadhiwa ✓','Site location saved ✓'),'ok');
  };
  window.seWxFullscreen=function(){
    const c=$('wxMapCard');if(!c)return;const on=!c.classList.contains('wx-full');c.classList.toggle('wx-full',on);
    const b=$('wxFsBtn');if(b)b.textContent=on?'✕ '+bi('Funga skrini nzima','Exit full screen'):'⛶ '+bi('Skrini nzima','Full screen');
    document.body.style.overflow=on?'hidden':'';
    setTimeout(function(){try{W.map.invalidateSize();}catch(_){}},120);
  };
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){const c=$('wxMapCard');if(c&&c.classList.contains('wx-full'))seWxFullscreen();}});
  window.seWxRefresh=function(){
    const p=finProject(W.pid);if(!p)return;
    if(!W.map&&window.LL)initMap();
    Object.keys(W.cache).forEach(function(k){delete W.cache[k];});
    if(W.lat!=null)loadWeather(W.lat,W.lng,false);else resolveSite(p);
  };

  /* ---------- Hali ya hewa ---------- */
  async function loadWeather(lat,lng,silent){
    const key=round(lat,3)+','+round(lng,3);const now=Date.now();
    const box=$('wxNow');if(!box)return;
    if(!silent&&!(W.cache[key]&&now-W.cache[key].at<10*60*1000))box.innerHTML='<div class="wx-skel">⏳ '+bi('Inapakia hali ya hewa…','Loading weather…')+'</div>';
    let data=W.cache[key]&&now-W.cache[key].at<10*60*1000?W.cache[key]:null;
    if(!data){
      try{
        const wx=await fetchJSON('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lng
          +'&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day,uv_index'
          +'&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_gusts_10m'
          +'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,sunrise,sunset,uv_index_max'
          +'&timezone=auto&forecast_days=7',14000);
        let aq=null;try{aq=await fetchJSON('https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+lat+'&longitude='+lng+'&current=pm10,pm2_5,european_aqi&timezone=auto',8000);}catch(_){}
        data={at:now,wx:wx,aq:aq};W.cache[key]=data;
      }catch(err){
        if(!$('wxNow'))return;
        box.innerHTML='<div class="wx-skel">⚠️ '+bi('Imeshindwa kupata hali ya hewa. Angalia mtandao wako kisha bonyeza “Sasisha”.','Could not load the weather. Check your connection, then press “Refresh”.')+'</div>';return;
      }
    }
    if(W.lat!==round(lat,6)&&W.lat!==lat)return;
    render(data);
  }
  function render(data){
    const wx=data.wx,c=wx.current||{},d=wx.daily||{},h=wx.hourly||{};
    const box=$('wxNow');if(!box)return;
    const w=wmo(c.weather_code,c.is_day);
    const tz=wx.timezone;let local='';try{local=new Date().toLocaleTimeString(seLocale(),{timeZone:tz,hour:'2-digit',minute:'2-digit'});}catch(_){}
    const up=$('wxUpdated');if(up)up.textContent=bi('Imesasishwa ','Updated ')+new Date(data.at).toLocaleTimeString(seLocale(),{hour:'2-digit',minute:'2-digit'});
    const pm=data.aq&&data.aq.current&&isFinite(Number(data.aq.current.pm10))&&data.aq.current.pm10!==null?data.aq.current:null;
    const stat=function(k,val,s){return '<div class="wx-stat"><div class="k">'+k+'</div><div class="v">'+val+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>';};
    const today=days(wx)[0]||{};
    box.innerHTML='<div class="wx-now-top"><div class="wx-icon">'+w.icon+'</div><div><div class="wx-temp">'+Math.round(c.temperature_2m)+'°C</div><div class="wx-desc">'+esc(w.text)+'</div>'
       +'<div class="small muted">'+bi('Linahisika kama ','Feels like ')+Math.round(c.apparent_temperature)+'° • '+bi('Juu ','High ')+Math.round(today.tmax)+'° / '+bi('Chini ','Low ')+Math.round(today.tmin)+'°'+(local?' • 🕒 '+local:'')+'</div></div></div>'
      +'<div class="wx-stats">'
       +stat('💧 '+bi('Unyevu','Humidity'),Math.round(c.relative_humidity_2m)+'%')
       +stat('💨 '+bi('Upepo','Wind'),Math.round(c.wind_speed_10m)+' km/h',compass(c.wind_direction_10m)+' • '+bi('mawimbi ','gusts ')+Math.round(c.wind_gusts_10m)+' km/h')
       +stat('☔ '+bi('Mvua leo','Rain today'),(today.prob!=null?today.prob:0)+'%',round(today.mm,1)+' mm '+bi('zinatarajiwa','expected'))
       +stat('☀️ UV',round(c.uv_index,1),uvLvl(c.uv_index))
       +stat('☁️ '+bi('Mawingu','Cloud cover'),Math.round(c.cloud_cover)+'%')
       +stat('🌡️ '+bi('Mgandamizo wa hewa','Pressure'),Math.round(c.pressure_msl)+' hPa')
       +stat('🌅 '+bi('Macheo / Machweo','Sunrise / Sunset'),hhmm((d.sunrise||[])[0])+' / '+hhmm((d.sunset||[])[0]))
       +(pm?stat('🌫️ '+bi('Vumbi hewani (PM10)','Dust (PM10)'),Math.round(pm.pm10)+' µg/m³',Number(pm.pm10)>50?bi('Juu — vaa barakoa','High — wear masks'):bi('Kawaida','Normal')):stat('🌧️ '+bi('Mvua sasa','Rain now'),round(c.precipitation,1)+' mm'))
      +'</div>'
      +'<h4 style="margin:14px 0 6px">💡 '+bi('Ushauri wa leo kwa site','Today\'s site advice')+'</h4>'+advice(c,days(wx));
    renderHourly(h,c);
    renderDays(wx);
  }
  function days(wx){
    const d=wx.daily||{};return (d.time||[]).map(function(t,i){return {date:t,code:(d.weather_code||[])[i],tmax:round((d.temperature_2m_max||[])[i]),tmin:round((d.temperature_2m_min||[])[i]),mm:round((d.precipitation_sum||[])[i],1),prob:(d.precipitation_probability_max||[])[i]||0,wind:round((d.wind_speed_10m_max||[])[i]),gust:round((d.wind_gusts_10m_max||[])[i]),uv:(d.uv_index_max||[])[i]};});
  }
  function advice(c,ds){
    const out=[],t=ds[0]||{},tm=ds[1]||{};
    if(t.code>=95||c.weather_code>=95)out.push(['danger','⛈️ '+bi('Radi inatarajiwa leo. Simamisha kazi za juu na za vifaa vya chuma wakati wa radi; wafanyakazi wakae kwenye kivuli salama.','Thunderstorms expected today. Stop work at height and with metal equipment during storms; keep workers in safe shelter.')]);
    if(t.prob>=60||t.mm>=5)out.push(['danger','🌧️ '+bi('Mvua inatarajiwa leo ('+t.prob+'%, '+t.mm+' mm). Ahirisha zege na rangi za nje; funika saruji na mbao.','Rain expected today ('+t.prob+'%, '+t.mm+' mm). Postpone concrete and external painting; cover cement and timber.')]);
    else if(t.prob>=30)out.push(['warn','🌦️ '+bi('Uwezekano wa mvua leo '+t.prob+'%. Andaa turubai na mpango mbadala.','Rain chance today '+t.prob+'%. Prepare tarpaulins and a fallback plan.')]);
    if(c.wind_gusts_10m>=50||t.gust>=50)out.push(['danger','💨 '+bi('Upepo mkali (mawimbi hadi '+Math.max(Math.round(c.wind_gusts_10m),t.gust)+' km/h). Epuka kazi za paa, jukwaa na kreni.','Strong wind (gusts up to '+Math.max(Math.round(c.wind_gusts_10m),t.gust)+' km/h). Avoid roofing, scaffolding and crane lifts.')]);
    else if(t.gust>=35)out.push(['warn','💨 '+bi('Upepo wa kasi (mawimbi '+t.gust+' km/h). Funga mabati na vifaa vyepesi.','Gusty wind ('+t.gust+' km/h). Secure roofing sheets and light materials.')]);
    if(t.tmax>=33)out.push(['warn','🥵 '+bi('Joto kali ('+t.tmax+'°C). Hakikisha maji ya kunywa, mapumziko kivulini, na mwagilia zege mara kwa mara.','High heat ('+t.tmax+'°C). Provide drinking water and shaded breaks, and keep concrete moist.')]);
    if(Number(c.uv_index)>=8)out.push(['warn','☀️ '+bi('Mionzi ya jua ni mikali (UV '+round(c.uv_index,1)+'). Kofia na nguo za mikono mirefu zinashauriwa.','Very strong sun (UV '+round(c.uv_index,1)+'). Hats and long sleeves recommended.')]);
    if(tm.prob>=60)out.push(['warn','📅 '+bi('Kesho mvua inatarajiwa ('+tm.prob+'%). Maliza kazi za nje leo kama inawezekana.','Rain expected tomorrow ('+tm.prob+'%). Finish outdoor work today if possible.')]);
    if(!out.length)out.push(['info','✅ '+bi('Hali ni nzuri kwa kazi za site leo. Hakuna tahadhari maalum.','Good conditions for site work today. No special precautions.')]);
    return out.map(function(a){return '<div class="fin-alert '+a[0]+'">'+esc(a[1])+'</div>';}).join('');
  }
  function renderHourly(h,c){
    const el=$('wxHourly');if(!el||typeof Chart==='undefined'||!h.time)return;
    let i0=h.time.findIndex(function(t){return t>=String(c.time||'').slice(0,13);});if(i0<0)i0=0;
    const idx=[];for(let i=i0;i<Math.min(h.time.length,i0+24);i++)idx.push(i);
    try{const old=Chart.getChart(el);if(old)old.destroy();}catch(_){}
    const dark=document.documentElement.getAttribute('data-theme')==='dark';
    try{new Chart(el,{data:{labels:idx.map(function(i){return h.time[i].slice(11,16);}),datasets:[
      {type:'line',label:bi('Joto (°C)','Temperature (°C)'),data:idx.map(function(i){return h.temperature_2m[i];}),borderColor:'#ffb000',backgroundColor:'rgba(255,176,0,.15)',yAxisID:'t',tension:.35,pointRadius:2,fill:false},
      {type:'bar',label:bi('Uwezekano wa mvua (%)','Rain chance (%)'),data:idx.map(function(i){return h.precipitation_probability[i];}),backgroundColor:dark?'rgba(96,165,250,.45)':'rgba(1,58,122,.28)',yAxisID:'p',borderRadius:4},
      {type:'bar',label:bi('Mvua (mm)','Rain (mm)'),data:idx.map(function(i){return h.precipitation[i];}),backgroundColor:'rgba(14,165,233,.8)',yAxisID:'m',borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom'}},
        scales:{t:{position:'left',ticks:{callback:function(v){return v+'°';}}},p:{position:'right',min:0,max:100,grid:{display:false},ticks:{callback:function(v){return v+'%';}}},m:{display:false,min:0,suggestedMax:10},x:{ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:12}}}}});}catch(e){console.warn(e);}
  }
  function renderDays(wx){
    const ds=days(wx);const box=$('wxDaily');if(!box)return;
    box.innerHTML=ds.map(function(d,i){const w=wmo(d.code,1);return '<div class="wx-day '+(i===0?'today':'')+'"><div class="dn">'+esc(dayName(d.date,i))+'</div><div class="dd">'+esc(shortDate(d.date))+'</div><div class="di">'+w.icon+'</div><div class="dx">'+esc(w.text)+'</div>'
      +'<div class="dt">'+d.tmax+'° <span>/ '+d.tmin+'°</span></div><div class="dr">☔ '+d.prob+'% · '+d.mm+' mm</div><div class="dr">💨 '+d.gust+' km/h</div></div>';}).join('');
    const pl=$('wxPlanner');if(!pl)return;
    const sym=['✅','⚠️','⛔'],cls=['go','care','stop'],lbl=[bi('Inafaa','Good'),bi('Kwa tahadhari','Caution'),bi('Haifai','Not advised')];
    const best=ds.map(function(d,i){return {i:i,r:rate('concrete',d)};}).filter(function(x){return x.r.lvl===0;}).slice(0,3).map(function(x){return dayName(ds[x.i].date,x.i)+' ('+shortDate(ds[x.i].date)+')';});
    pl.innerHTML='<table class="wx-plan"><tr><th>'+bi('Kazi','Activity')+'</th>'+ds.map(function(d,i){return '<th>'+esc(dayName(d.date,i))+'<br><span class="small muted">'+esc(shortDate(d.date))+'</span></th>';}).join('')+'</tr>'
      +ACTS.map(function(a){return '<tr><td>'+a[1]+' '+esc(bi(a[2],a[2]))+'</td>'+ds.map(function(d){const r=rate(a[0],d);const tip=lbl[r.lvl]+(r.why.length?': '+r.why.join('; '):'');return '<td><span class="wx-cell '+cls[r.lvl]+'" title="'+esc(tip)+'" aria-label="'+esc(tip)+'" tabindex="0" onclick="toast(this.title)">'+sym[r.lvl]+'</span></td>';}).join('')+'</tr>';}).join('')
      +'</table><div class="wx-legend"><span>✅ '+lbl[0]+'</span><span>⚠️ '+lbl[1]+'</span><span>⛔ '+lbl[2]+'</span></div>'
      +'<div class="wx-best">🧱 <b>'+bi('Siku bora za kumwaga zege: ','Best days to pour concrete: ')+'</b>'+(best.length?esc(best.join(', ')):bi('hakuna siku yenye hali nzuri kabisa wiki hii — panga kwa tahadhari.','no fully suitable day this week — plan with caution.'))+'</div>';
  }
  /* ACTS huhifadhi maandishi ya lugha iliyokuwepo mwanzo; yasasishe kila mara lugha inapobadilika */
  const _render=renderDays;
  renderDays=function(wx){ACTS[0][2]=bi('Kumwaga zege','Concrete pouring');ACTS[1][2]=bi('Kazi za juu / paa','Work at height / roofing');ACTS[2][2]=bi('Rangi & lipu za nje','External painting & plaster');ACTS[3][2]=bi('Uchimbaji & ujazaji','Excavation & earthworks');return _render(wx);};

  /* Leaflet huhifadhiwa kama window.LL ili isigongane na bi() ya lugha */
  if(window.L&&window.L.map&&!window.LL)window.LL=window.L;
})();
</script>

<script>
(function(){

  const MAX_TRIES=5,LOCK_MIN=15;
  let view='login',fpUser=null;

  function v(x){const el=document.getElementById(x);return el?String(el.value||'').trim():'';}
  function raw(x){return (document.getElementById(x)||{}).value||'';}
  function normAns(a){return String(a||'').trim().toLowerCase().replace(/\s+/g,' ');}
  function tr(s){return window.seTr?window.seTr(s):s;}
  function strongPw(pw){return pw.length>=8&&/[A-Za-z]/.test(pw)&&/[0-9]/.test(pw);}

  function isActive(u){return !!u&&(u.status||'ACTIVE')==='ACTIVE';}

  function msg(boxId,text,ok){const b=document.getElementById(boxId);if(!b)return;b.classList.remove('hidden');b.classList.toggle('ok',!!ok);b.textContent=tr(text);}
  function qOptions(sel){return '<option value="">— Chagua swali la usalama —</option>'+QUESTIONS.map(function(q){return '<option value="'+esc(q)+'" '+(q===sel?'selected':'')+'>'+esc(q)+'</option>';}).join('');}
  function langSel(){return '<div class="lm-lang"><select id="loginLangSel" aria-label="Lugha / Language" onchange="setLang(this.value)"><option value="sw" '+(seLang()==='sw'?'selected':'')+'>🇹🇿 Kiswahili</option><option value="en" '+(seLang()==='en'?'selected':'')+'>🇬🇧 English</option></select></div>';}
  function brand(){
    return '<div class="lm-brand">'+langSel()
     +'<div class="lm-brand-inner"><div class="lm-logo">🏗️</div><h1>Smart Empire<br>Platform System</h1>'
     +'<p>Global Construction Management &amp; Intelligence Platform</p><ul class="lm-features">'
     +'<li>✓ Mkataba, Saini na Ufuatiliaji wa Bajeti</li><li>✓ Faida/Hasara na Cash Flow kwa Real-time</li>'
     +'<li>✓ Ripoti za PDF/Excel papo kwa hapo</li><li>✓ Inafanya kazi offline, kwenye simu na computer</li></ul></div></div>';
  }
  function frame(card){
    const box=document.getElementById('auth');box.classList.remove('hidden');
    const sh=document.getElementById('shell');if(sh)sh.classList.add('hidden');
    box.innerHTML='<div class="lm-wrap">'+brand()+'<div class="lm-formside"><div class="card lm-card">'+card+'</div></div></div>';
    const first=box.querySelector('.lm-card input');if(first)try{first.focus();}catch(_){}
  }

  /* ---------------- LOGIN ---------------- */
  window.auth=function(){
    view='login';fpUser=null;
    frame('<h2>Karibu Tena</h2><p class="muted">Ingia kuendelea na miradi yako</p>'
     +'<input id="u" autocomplete="username" placeholder="Jina la mtumiaji">'
     +'<input id="p" type="password" autocomplete="current-password" placeholder="Nenosiri" onkeydown="if(event.key===\'Enter\')login()">'
     +'<div class="lm-row"><button type="button" class="lm-link" onclick="seForgotPage()">Umesahau nenosiri?</button></div>'
     +'<button id="loginBtn" style="width:100%" onclick="login()">INGIA</button>'
     +'<div id="e" class="notice hidden"></div>'
     +'<div class="lm-switch">Huna akaunti? <button type="button" class="lm-link" onclick="seSignupPage()">Fungua akaunti mpya</button></div>');
  };

  /* ---------------- FUNGUA AKAUNTI ---------------- */
  window.seSignupPage=async function(){
    if(window.seHasRealAdmin&&!(await seHasRealAdmin()))return setupPage();
    view='signup';
    frame('<h2>Fungua Akaunti</h2><p class="muted">Jaza taarifa zako ili kuanza kutumia mfumo</p>'
     +'<input id="rgName" placeholder="Jina kamili *" autocomplete="name">'
     +'<input id="rgUser" placeholder="Jina la mtumiaji *" autocomplete="username">'
     +'<input id="rgEmail" type="email" placeholder="Barua pepe (hiari)" autocomplete="email">'
     +'<input id="rgPhone" type="tel" placeholder="Simu (hiari)" autocomplete="tel">'
     +'<input id="rgPw" type="password" placeholder="Nenosiri * (herufi 8+, herufi na namba)" autocomplete="new-password">'
     +'<input id="rgPw2" type="password" placeholder="Rudia nenosiri *" autocomplete="new-password">'
     +'<label class="lm-label" for="rgQ">Swali la usalama (litakusaidia ukisahau nenosiri)</label>'
     +'<select id="rgQ">'+qOptions('')+'</select>'
     +'<input id="rgA" placeholder="Jibu la swali la usalama *" autocomplete="off" onkeydown="if(event.key===\'Enter\')seRegister()">'
     +'<button id="rgBtn" style="width:100%" onclick="seRegister()">FUNGUA AKAUNTI</button>'
     +'<div id="rgErr" class="notice hidden"></div>'
     +'<div class="lm-switch">Tayari una akaunti? <button type="button" class="lm-link" onclick="auth()">Ingia</button></div>');
  };
  window.seRegister=async function(){
    const btn=document.getElementById('rgBtn');
    const name=v('rgName'),username=v('rgUser'),email=v('rgEmail'),phone=v('rgPhone'),pw=raw('rgPw'),pw2=raw('rgPw2'),q=v('rgQ'),ans=normAns(raw('rgA'));
    const fail=function(m){msg('rgErr',m);};
    if(!name||!username||!pw)return fail('Jaza jina kamili, jina la mtumiaji na nenosiri.');
    if(!/^[A-Za-z0-9._-]{3,}$/.test(username))return fail('Jina la mtumiaji liwe na herufi 3 au zaidi (herufi, namba, . _ -) bila nafasi.');
    if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return fail('Barua pepe si sahihi.');
    if(!strongPw(pw))return fail('Nenosiri liwe na angalau herufi 8, likiwa na herufi na namba.');
    if(pw!==pw2)return fail('Manenosiri hayafanani.');
    if(!q)return fail('Chagua swali la usalama.');
    if(ans.length<2)return fail('Weka jibu la swali la usalama.');
    if(window.seHasRealAdmin&&!(await seHasRealAdmin()))return setupPage();
    try{normalizeRoles();}catch(_){}
    if(findByUsername(username))return fail('Jina hilo la mtumiaji tayari linatumika.');
    if(btn)btn.disabled=true;
    try{
      const u={id:id(),name:name,username:username,email:email,phone:phone,password:await hashPassword(pw),role:'BOSS',status:'ACTIVE',
        modules:modulesList(),recoveryQ:q,recoveryA:await hashPassword(ans),selfRegistered:true,createdAt:new Date().toISOString(),lastLogin:new Date().toISOString()};
      state.users.push(u);
      state.accountModules=state.accountModules||{};state.accountModules[u.id]=u.modules.slice();
      me=u;
      try{localStorage.setItem('jm_session',u.id);}catch(_){}
      try{audit('ACCOUNT_CREATED',u.username+' (BOSS) — amejisajili mwenyewe');}catch(_){}
      try{logHistory('ACCOUNT_CREATED',u.name+' (BOSS)');}catch(_){}
      save();
      toast('Akaunti imefunguliwa ✓ Karibu, '+name+'!','ok');
      boot();
    }catch(err){console.error(err);if(btn)btn.disabled=false;fail('Imeshindikana kufungua akaunti. Jaribu tena.');}
  };
  /* Kitufe cha zamani cha "register" sasa kinafungua ukurasa huu. */
  window.register=function(){seSignupPage();};

  /* ---------------- UMESAHAU NENOSIRI ---------------- */
  window.seForgotPage=function(){
    view='forgot';fpUser=null;
    frame('<h2>Umesahau Nenosiri?</h2><p class="muted">Weka jina lako la mtumiaji ili kuweka nenosiri jipya</p>'
     +'<input id="fpUser" autocomplete="username" placeholder="Jina la mtumiaji" value="'+esc(v('u'))+'" onkeydown="if(event.key===\'Enter\')seForgotFind()">'
     +'<button style="width:100%" onclick="seForgotFind()">ENDELEA</button>'
     +'<div id="fpErr" class="notice hidden"></div>'
     +'<button type="button" class="alt lm-back" onclick="auth()">← Rudi kwenye kuingia</button>');
  };
  window.seForgotFind=function(){
    const uname=v('fpUser');
    if(!uname)return msg('fpErr','Weka jina la mtumiaji.');
    const u=findByUsername(uname);
    if(!u)return msg('fpErr','Jina hilo la mtumiaji halijapatikana.');
    if(!isActive(u))return msg('fpErr','Akaunti hii imezimwa. Wasiliana na Admin.');
    if(!u.recoveryQ||!u.recoveryA)return msg('fpErr','Akaunti hii haina swali la usalama. Wasiliana na Admin akuwekee nenosiri jipya.');
    fpUser=u.id;seForgotStep2();
  };
  function seForgotStep2(){
    const u=(state.users||[]).find(function(x){return x.id===fpUser;});if(!u)return seForgotPage();
    view='forgot2';
    frame('<h2>Weka Nenosiri Jipya</h2><p class="muted">Jibu swali lako la usalama</p>'
     +'<div class="lm-q">'+esc(tr(u.recoveryQ))+'</div>'
     +'<input id="fpAns" placeholder="Jibu lako" autocomplete="off">'
     +'<input id="fpPw" type="password" placeholder="Nenosiri jipya * (herufi 8+, herufi na namba)" autocomplete="new-password">'
     +'<input id="fpPw2" type="password" placeholder="Rudia nenosiri jipya *" autocomplete="new-password" onkeydown="if(event.key===\'Enter\')seForgotReset()">'
     +'<button id="fpBtn" style="width:100%" onclick="seForgotReset()">WEKA NENOSIRI JIPYA</button>'
     +'<div id="fpErr" class="notice hidden"></div>'
     +'<button type="button" class="alt lm-back" onclick="auth()">← Rudi kwenye kuingia</button>');
  }
  window.seForgotReset=async function(){
    const u=(state.users||[]).find(function(x){return x.id===fpUser;});if(!u)return seForgotPage();
    const now=Date.now();
    if(u.recoveryLockUntil&&now<u.recoveryLockUntil){
      const m=Math.ceil((u.recoveryLockUntil-now)/60000);
      return msg('fpErr','Majaribio mengi mno. Jaribu tena baada ya dakika '+m+'.');
    }
    const ans=normAns(raw('fpAns')),pw=raw('fpPw'),pw2=raw('fpPw2');
    if(!ans)return msg('fpErr','Weka jibu la swali la usalama.');
    if(!strongPw(pw))return msg('fpErr','Nenosiri liwe na angalau herufi 8, likiwa na herufi na namba.');
    if(pw!==pw2)return msg('fpErr','Manenosiri hayafanani.');
    let ok=false;try{ok=await verifyPassword(ans,u.recoveryA);}catch(_){ok=false;}
    if(!ok){
      u.recoveryFails=(u.recoveryFails||0)+1;
      if(u.recoveryFails>=MAX_TRIES){u.recoveryLockUntil=now+LOCK_MIN*60000;u.recoveryFails=0;save();return msg('fpErr','Majaribio mengi mno. Jaribu tena baada ya dakika '+LOCK_MIN+'.');}
      save();
      return msg('fpErr','Jibu si sahihi. Umebakiza majaribio '+(MAX_TRIES-u.recoveryFails)+'.');
    }
    u.password=await hashPassword(pw);
    u.recoveryFails=0;delete u.recoveryLockUntil;
    const prevMe=me;me=u;try{audit('PASSWORD_RESET',u.username+' — kupitia swali la usalama');}catch(_){}me=prevMe;
    save();
    const uname=u.username;
    auth();
    const ub=document.getElementById('u');if(ub)ub.value=uname;
    const pb=document.getElementById('p');if(pb)try{pb.focus();}catch(_){}
    msg('e','Nenosiri jipya limewekwa ✓ Sasa ingia.',true);
  };

  /* ---------------- Badili lugha bila kupoteza ukurasa ulipo ---------------- */
  const _setLang=window.setLang;
  window.setLang=function(l){
    const cur=view,keep=fpUser;
    _setLang(l);
    const shellOn=!document.getElementById('shell').classList.contains('hidden');
    if(shellOn||document.getElementById('suName'))return;
    if(cur==='signup')seSignupPage();
    else if(cur==='forgot')seForgotPage();
    else if(cur==='forgot2'){fpUser=keep;seForgotStep2();}
  };

  /* ---------------- Swali la usalama kwa walio ndani ya mfumo ---------------- */
  const _cpPage=window.changePasswordPage;
  window.changePasswordPage=function(){
    _cpPage();
    if(!me||!app)return;
    const has=!!(me.recoveryQ&&me.recoveryA);
    app.insertAdjacentHTML('beforeend','<div class="card" style="max-width:460px"><h3>🛟 Swali la Usalama</h3>'
      +'<p class="small muted">'+(has?'Umeshaweka swali la usalama. Unaweza kulibadilisha hapa.':'Bado hujaweka swali la usalama. Liweke ili uweze kuweka nenosiri jipya mwenyewe ukilisahau.')+'</p>'
      +'<label>Swali la usalama</label><select id="rqQ">'+qOptions(me.recoveryQ||'')+'</select>'
      +'<label>Jibu</label><input id="rqA" autocomplete="off">'
      +'<label>Nenosiri la sasa</label><input id="rqPw" type="password" autocomplete="current-password">'
      +'<button onclick="seSaveRecovery()">HIFADHI SWALI LA USALAMA</button></div>');
    if(window.seTranslateNow)seTranslateNow();
  };
  window.seSaveRecovery=async function(){
    if(!me)return;
    const q=v('rqQ'),ans=normAns(raw('rqA')),pw=raw('rqPw');
    if(!q)return toast('Chagua swali la usalama.','err');
    if(ans.length<2)return toast('Weka jibu la swali la usalama.','err');
    if(!(await verifyPassword(pw,me.password)))return toast('Nenosiri la sasa si sahihi.','err');
    me.recoveryQ=q;me.recoveryA=await hashPassword(ans);me.recoveryFails=0;delete me.recoveryLockUntil;
    try{audit('RECOVERY_SET',me.username);}catch(_){}
    save();toast('Swali la usalama limehifadhiwa ✓','ok');changePasswordPage();
  };

  /* ---------------- Tafsiri (English) ---------------- */
  if(window.seI18nAdd)seI18nAdd([
    ['Umesahau nenosiri?','Forgot password?'],['Huna akaunti?','No account yet?'],['Fungua akaunti mpya','Create a new account'],
    ['Fungua Akaunti','Create Account'],['Jaza taarifa zako ili kuanza kutumia mfumo','Fill in your details to start using the system'],
    ['FUNGUA AKAUNTI','CREATE ACCOUNT'],['Tayari una akaunti?','Already have an account?'],
    ['Swali la usalama (litakusaidia ukisahau nenosiri)','Security question (helps you if you forget your password)'],
    ['— Chagua swali la usalama —','— Choose a security question —'],['Jibu la swali la usalama *','Answer to the security question *'],
    ['Jina la shule yako ya msingi?','What was the name of your primary school?'],['Jina la mnyama wako wa kwanza wa kufugwa?','What was the name of your first pet?'],
    ['Mji alikozaliwa mama yako?','In which town was your mother born?'],['Jina la rafiki yako wa utotoni?','What is the name of your childhood friend?'],
    ['Chakula unachokipenda zaidi?','What is your favourite food?'],
    ['Umesahau Nenosiri?','Forgot Your Password?'],['Weka jina lako la mtumiaji ili kuweka nenosiri jipya','Enter your username to set a new password'],
    ['ENDELEA','CONTINUE'],['← Rudi kwenye kuingia','← Back to sign in'],['Weka Nenosiri Jipya','Set a New Password'],
    ['Jibu swali lako la usalama','Answer your security question'],['Jibu lako','Your answer'],
    ['Nenosiri jipya * (herufi 8+, herufi na namba)','New password * (8+ characters, letters and numbers)'],['Rudia nenosiri jipya *','Repeat new password *'],
    ['WEKA NENOSIRI JIPYA','SET NEW PASSWORD'],['Weka jina la mtumiaji.','Enter your username.'],
    ['Jina hilo la mtumiaji halijapatikana.','That username was not found.'],
    ['Akaunti hii haina swali la usalama. Wasiliana na Admin akuwekee nenosiri jipya.','This account has no security question. Ask the Admin to set a new password for you.'],
    ['Chagua swali la usalama.','Choose a security question.'],['Weka jibu la swali la usalama.','Enter the answer to the security question.'],
    ['Imeshindikana kufungua akaunti. Jaribu tena.','Could not create the account. Try again.'],
    ['Nenosiri jipya limewekwa ✓ Sasa ingia.','New password set ✓ Now sign in.'],
    ['🛟 Swali la Usalama','🛟 Security Question'],['Swali la usalama','Security question'],['Jibu','Answer'],
    ['Umeshaweka swali la usalama. Unaweza kulibadilisha hapa.','You have already set a security question. You can change it here.'],
    ['Bado hujaweka swali la usalama. Liweke ili uweze kuweka nenosiri jipya mwenyewe ukilisahau.','You have not set a security question yet. Set one so you can reset your password yourself if you forget it.'],
    ['HIFADHI SWALI LA USALAMA','SAVE SECURITY QUESTION'],['Swali la usalama limehifadhiwa ✓','Security question saved ✓']
  ]);
  if(window.seI18nPatterns&&seI18nPatterns.en){
    seI18nPatterns.en.push([/^Jibu si sahihi\. Umebakiza majaribio (\d+)\.$/,'Wrong answer. $1 attempt(s) left.']);
    seI18nPatterns.en.push([/^Majaribio mengi mno\. Jaribu tena baada ya dakika (\d+)\.$/,'Too many attempts. Try again in $1 minute(s).']);
    seI18nPatterns.en.push([/^Akaunti imefunguliwa ✓ Karibu, (.+)!$/,'Account created ✓ Welcome, $1!']);
  }

  /* Kama login page tayari imeshachorwa na toleo la zamani, ichore upya. */
  const box=document.getElementById('auth');
  if(box&&!box.classList.contains('hidden')&&document.getElementById('loginBtn')&&!box.querySelector('.lm-link'))auth();
})();
</script>

/* ---------- Ticker: maandishi yanayotembea ---------- */
.se9-ticker{flex:1 0 100%;min-width:0;margin:0 -22px;display:flex;align-items:stretch;height:34px;overflow:hidden;background:rgba(0,0,0,.22);border-top:1px solid rgba(255,255,255,.08);position:relative}
.se9-ticker-lbl{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:0 14px 0 18px;font-family:var(--font-head);font-weight:800;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#2b1d00;background:linear-gradient(135deg,var(--gold-bright),var(--a));clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);padding-right:24px;z-index:2}
.se9-ticker-lbl i{font-style:normal;width:7px;height:7px;border-radius:50%;background:#b91c1c;animation:se9Blink 1s steps(2) infinite}

.se9-ticker-vp{flex:1;min-width:0;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}

/* ---------- Kurasa: kuingia kwa mwendo ---------- */

.se9-rise{animation:se9Rise .6s var(--se9-ease) backwards;animation-delay:calc(var(--i,0) * 55ms)}

@property --se9-ang{syntax:'<angle>';initial-value:0deg;inherits:false}

/* Footer wa app */

@media(max-width:750px){
  .se9-ticker{margin:0 -22px;height:30px}
  .se9-ticker-lbl{font-size:10px;padding-left:12px}
